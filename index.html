<!doctype html><html><head><meta charset=utf8><title>Italiano in Viaggio</title><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Italiano"><link rel="apple-touch-icon" href="icon-180.png?v=2"><link rel="icon" type="image/png" href="icon-192.png?v=2"><link rel="manifest" href="manifest.webmanifest?v=2"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Italiano in Viaggio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;350;400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar with centered tabs, gradient hero fading to pastel, then cards and pill controls on white. Palette: sea green, ocean blue and sun yellow */
:root{
  --bg:#ffffff;--surf:#ffffff;--soft:#f5f8f9;--ink:#14181b;--ink2:#434b52;--mute:#6b747b;--line:#e3e9ec;--line2:#eef3f5;
  --mag:#0080c0;--mag-ink:#005f94;--mag-soft:#e3f4fd;--mag-soft2:#c6e8fa;
  --green:#00a8a8;--green-ink:#00787a;--green-soft:#dbf5f5;
  --sun:#ff6200;--sun-ink:#b33f00;--sun-soft:#ffe6d1;
  --plum:#7a4fd0;--plum-ink:#5b35a8;--plum-soft:#efe8fc;--rose:#d43f6f;--rose-ink:#a82851;--rose-soft:#fde8ef;--deep:#2f4fb5;--deep-ink:#253f93;--deep-soft:#e6ecfb;
  --grad:linear-gradient(90deg,#10c9c4 0%,#14a4f0 100%);
  --tr:#a84a06;
  --crit:#c83c28;--crit-soft:#fdebe6;--warn:#b5591c;--warn-soft:#fff3e8;--ok:#00805f;--ok-soft:#e3f6ef;--blue:#0a7fae;--blue-soft:#eaf6fb;
  --hero:radial-gradient(95% 125% at 62% 125%,#ff6a00 0%,rgba(255,106,0,.72) 18%,rgba(255,120,20,.42) 36%,rgba(255,135,40,.16) 54%,rgba(255,145,50,0) 74%),radial-gradient(135% 155% at 94% 6%,#00c4c4 0%,rgba(0,196,196,.62) 20%,rgba(0,196,196,.28) 38%,rgba(0,196,196,.08) 52%,rgba(0,196,196,0) 64%),linear-gradient(100deg,#f2fbfb 0%,#e8f8f8 25%,#d4f1f3 45%,#b4e7ea 68%,#8ddbe0 100%);
  --hero-ink:#14181b;--hero-pill:#ffffff;
  --sans:"Figtree",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1418;--surf:#161d22;--soft:#1b242a;--ink:#eef4f6;--ink2:#c3ced3;--mute:#8f9ca3;--line:#2b363d;--line2:#212b31;
  --mag:#38c4ff;--mag-ink:#86dbff;--mag-soft:#11303d;--mag-soft2:#164152;
  --green:#2edcd6;--green-ink:#80ebe6;--green-soft:#133838;
  --sun:#ff7a1a;--sun-ink:#ffa060;--sun-soft:#3d2616;
  --plum:#b49cff;--plum-ink:#cdbdff;--plum-soft:#2a2240;--rose:#ff8fb2;--rose-ink:#ffb8cd;--rose-soft:#3d1f2a;--deep:#8fa8ff;--deep-ink:#b8c8ff;--deep-soft:#1c2440;
  --grad:linear-gradient(90deg,#22dcd2 0%,#2bbcff 100%);
  --tr:#ffb27a;
  --crit:#ff8a72;--crit-soft:#3d221d;--warn:#ffb27a;--warn-soft:#3a2a1d;--ok:#4fd8ae;--ok-soft:#173a30;--blue:#4cc3f0;--blue-soft:#11303d;
  --hero:radial-gradient(95% 125% at 62% 125%,#f06000 0%,rgba(240,96,0,.62) 18%,rgba(240,96,0,.34) 36%,rgba(240,96,0,.12) 54%,rgba(240,96,0,0) 74%),radial-gradient(135% 155% at 94% 6%,#00a0a6 0%,rgba(0,160,166,.6) 20%,rgba(0,160,166,.26) 38%,rgba(0,160,166,.08) 52%,rgba(0,160,166,0) 64%),linear-gradient(100deg,#0f191b 0%,#0f2226 30%,#0e2f35 55%,#0d4249 80%,#0b525a 100%);
  --hero-ink:#f2fbfd;--hero-pill:#1a2a31;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418;--surf:#161d22;--soft:#1b242a;--ink:#eef4f6;--ink2:#c3ced3;--mute:#8f9ca3;--line:#2b363d;--line2:#212b31;
  --mag:#38c4ff;--mag-ink:#86dbff;--mag-soft:#11303d;--mag-soft2:#164152;
  --green:#2edcd6;--green-ink:#80ebe6;--green-soft:#133838;
  --sun:#ff7a1a;--sun-ink:#ffa060;--sun-soft:#3d2616;
  --plum:#b49cff;--plum-ink:#cdbdff;--plum-soft:#2a2240;--rose:#ff8fb2;--rose-ink:#ffb8cd;--rose-soft:#3d1f2a;--deep:#8fa8ff;--deep-ink:#b8c8ff;--deep-soft:#1c2440;
  --grad:linear-gradient(90deg,#22dcd2 0%,#2bbcff 100%);
  --tr:#ffb27a;
  --crit:#ff8a72;--crit-soft:#3d221d;--warn:#ffb27a;--warn-soft:#3a2a1d;--ok:#4fd8ae;--ok-soft:#173a30;--blue:#4cc3f0;--blue-soft:#11303d;
  --hero:radial-gradient(95% 125% at 62% 125%,#f06000 0%,rgba(240,96,0,.62) 18%,rgba(240,96,0,.34) 36%,rgba(240,96,0,.12) 54%,rgba(240,96,0,0) 74%),radial-gradient(135% 155% at 94% 6%,#00a0a6 0%,rgba(0,160,166,.6) 20%,rgba(0,160,166,.26) 38%,rgba(0,160,166,.08) 52%,rgba(0,160,166,0) 64%),linear-gradient(100deg,#0f191b 0%,#0f2226 30%,#0e2f35 55%,#0d4249 80%,#0b525a 100%);
  --hero-ink:#f2fbfd;--hero-pill:#1a2a31;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:clamp(36px,5.2vw,56px);font-weight:350;letter-spacing:-.045em;line-height:1.02;margin:10px 0 12px}
h2{font-size:24px;font-weight:400;letter-spacing:-.02em}
h3{font-size:17px;font-weight:500}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--ink2)}
.muted{color:var(--mute)}
.min0{min-width:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.bar1{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px;padding-inline:24px;border-bottom:1px solid var(--line)}
.wordmark{font-size:17px;font-weight:600;letter-spacing:-.02em;background:none;border:0;padding:0}
.wordmark span{color:var(--mag)}
.meta{display:flex;gap:18px;color:var(--mute);font-size:12px;text-align:right;line-height:1.25}
.meta b{display:block;color:var(--ink);font-weight:500;font-size:16px}
.tabs{display:flex;justify-content:center;gap:4px 28px;padding:12px 16px 0;flex-wrap:wrap;border-bottom:1px solid var(--line2)}
.tab{background:none;border:0;padding:6px 6px 12px;color:var(--ink2);font-size:14px;position:relative}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--grad);border-radius:2px}
.tab .cnt{font-size:11px;color:var(--mag-ink);margin-left:4px}

.wrap{max-width:1080px;margin:0 auto;padding-inline:24px;padding-block:22px 72px;display:grid;gap:24px}
.wrap>*{min-width:0}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:14px;padding:32px 34px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:end;overflow:hidden}
.hero .eyebrow{color:var(--hero-ink);opacity:.8}
.hero p{margin:0;font-size:16px;max-width:60ch;opacity:.9}
.hpills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hpill{display:inline-flex;align-items:center;gap:8px;background:var(--hero-pill);color:var(--hero-ink);border:0;border-radius:999px;padding:9px 16px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.hpill:hover{box-shadow:0 0 0 2px var(--mag)}
.hpill i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.hpill:nth-child(2) i{background:var(--mag)}
.hpill:nth-child(3) i{background:var(--sun)}

/* cards & generic */
.card{border:1px solid var(--line);border-radius:10px;background:var(--surf);padding:20px;min-width:0}
.card .cd{color:var(--mute);font-size:12.5px;margin:2px 0 14px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;margin-bottom:12px}
.sh .d{color:var(--mute);font-size:12.5px}
.stack{display:grid;gap:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.started{background:var(--mag-soft);color:var(--mag-ink)}
.pill.new{background:var(--soft);color:var(--mute)}
.lvl{font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--sec-ink,var(--mag-ink));background:var(--sec-soft,var(--mag-soft));border-radius:999px;padding:2px 8px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:500;background:var(--ink);color:var(--bg);font-size:14px}
.btn.mag{background:var(--mag);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--mag)}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.backbtn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:6px 14px 6px 10px;font-size:13px}
.backbtn:hover{border-color:var(--mag)}

/* lesson grid */
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.lcard{border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:8px;background:var(--surf);text-align:left;min-width:0;align-content:start}
.lcard:hover{border-color:var(--sec,var(--mag))}
.lcard{border-top:3px solid var(--sec,var(--mag))}
.lcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lcard .n{font-size:11px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase}
.lcard h3{font-size:19px;font-weight:400;letter-spacing:-.02em}
.lcard .s{font-size:13px;color:var(--ink2)}
.lcard .ubar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.lcard .ubar span{display:block;height:100%;background:var(--sec,var(--mag));border-radius:3px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}

/* lesson view */
.lhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
.grammar{max-width:760px}
.grammar h3{font-size:22px;font-weight:400;letter-spacing:-.02em;margin-bottom:8px}
.grammar h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--green-ink);font-weight:600;margin:20px 0 6px}
.grammar p{margin:0 0 10px;max-width:68ch}
.mark{background:var(--sun-soft);color:var(--sun-ink);border-radius:4px;padding:0 4px;font-weight:500}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0 14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;color:var(--ink2);font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
td em{color:var(--mag-ink);font-style:normal;font-weight:600}
td.p{color:var(--mute);white-space:nowrap}
.ex{border-left:2px solid var(--green);padding:2px 0 2px 12px;margin:8px 0}
.ex span{display:block;color:var(--mute);font-size:14px}
.trap{background:var(--warn-soft);border-radius:10px;padding:12px 14px;font-size:14px;margin-top:12px}
.trap b{color:var(--warn)}

.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.voc{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surf)}
.voc .it{font-weight:600;color:var(--mag-ink)}
.voc .es{font-size:14px}
.voc .eg{font-size:13px;color:var(--mute);font-style:italic;margin-top:4px}
.voc.ff{background:var(--warn-soft);border-color:transparent}
.voc .tag{font-size:10px;font-weight:600;color:var(--warn);letter-spacing:.14em;text-transform:uppercase}

/* quiz */
.qbar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--grad);transition:width .3s}
.qcard{max-width:720px}
.prompt{font-size:22px;font-weight:350;letter-spacing:-.01em;margin:6px 0 12px;line-height:1.35}
.prompt .gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--mag);margin:0 4px}
.hint{font-size:13px;color:var(--mute);margin:-6px 0 12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:10px 18px;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--mag)}
.opt.sel{border-color:var(--mag);background:var(--mag-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--crit);background:var(--crit-soft)}
.inp{width:100%;height:44px;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:0 18px;font-size:16px}
.inp:focus{border-color:var(--mag);outline:none}
.inp.ok{border-color:var(--ok);background:var(--ok-soft)}
.inp.ko{border-color:var(--crit);background:var(--crit-soft)}
.inp.near{border-color:var(--warn);background:var(--warn-soft)}
.accents{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.accents button{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:2px 12px;font-size:15px}
.accents button:hover{border-color:var(--mag)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.chip{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:6px 14px;font-size:15px}
.chip:hover:not(:disabled){border-color:var(--mag)}
.chip.used{opacity:.25}
.built{border:1px dashed var(--line);border-radius:12px;padding:8px;margin-bottom:10px}
.built .chip{background:var(--mag-soft);border-color:var(--mag-soft2);color:var(--mag-ink)}
.fb{border-radius:10px;padding:12px 14px;font-size:14px}
.fb.ok{background:var(--ok-soft)}
.fb.ok b{color:var(--ok)}
.fb.ko{background:var(--crit-soft)}
.fb.ko b{color:var(--crit)}
.score{font-size:64px;font-weight:300;letter-spacing:-.05em;line-height:1;color:var(--mag-ink)}

/* conjugator */
.ctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.f{display:grid;gap:6px;min-width:0}
.f label{font-size:12px;color:var(--ink2)}
.f select{height:40px;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:0 34px 0 14px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 17px,calc(100% - 13px) 17px;background-size:5px 5px;background-repeat:no-repeat;min-width:150px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink2)}
.tchip[aria-pressed="true"]{background:var(--mag-soft);border-color:var(--mag-soft2);color:var(--mag-ink);font-weight:500}
.verbhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.verbhead .v{font-size:40px;font-weight:300;letter-spacing:-.04em}
.verbhead .t{font-size:13px;color:var(--mag-ink);font-weight:500}
.cgrid{display:grid;grid-template-columns:110px minmax(0,1fr) 36px minmax(0,.85fr);gap:8px 12px;align-items:center;max-width:900px}
.tes{display:flex;align-items:center;min-height:44px;padding:4px 14px;border-radius:12px;background:var(--soft);border:1px solid var(--line2);color:var(--ink2);font-size:14.5px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.tes.wait{color:var(--mute)}
.tesh{grid-column:4;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:500;padding-left:4px}
.spk{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--mag-ink);display:inline-grid;place-items:center;padding:0;flex:none}
.spk:hover{border-color:var(--mag)}
.spk svg{width:16px;height:16px}
.spk.sm{width:26px;height:26px}.spk.sm svg{width:13px;height:13px}
.spkall{display:inline-flex;align-items:center;gap:6px}
.spkall svg{width:15px;height:15px}
.ref td.s{width:30px;padding:3px 4px}
.ref .rh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.cgrid .pr{color:var(--ink2);font-size:14px;text-align:right}
.cgrid .sol{grid-column:2;font-size:13px;color:var(--crit);margin-top:-4px}
.ansx{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;min-height:44px;border-radius:22px;padding:6px 18px;border:1px solid var(--crit);background:var(--crit-soft);font-size:16px;min-width:0}
.ansx.near{border-color:var(--warn);background:var(--warn-soft)}
.ansx s{color:var(--mute);text-decoration-color:var(--crit);text-decoration-thickness:2px}
.ansx .ar{color:var(--mute);font-size:14px}
.ansx b{font-size:20px;font-weight:600;color:var(--ok);letter-spacing:-.01em}
.ansx small{font-size:12px;color:var(--warn);font-weight:500}
.ref{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ref .card{padding:14px}
.ref table td{padding:5px 8px;font-size:13.5px}
.tag-irr{font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 8px}

/* review */
.flash{width:100%;min-height:240px;border:1px solid var(--line);border-radius:14px;background:var(--surf);display:grid;place-items:center;text-align:center;padding:28px;position:relative}
.flash:hover{border-color:var(--mag)}
.flash .front{font-size:clamp(30px,6vw,44px);font-weight:300;letter-spacing:-.03em}
.flash .back-es{font-size:20px;font-weight:500;margin-top:8px;color:var(--mag-ink)}
.flash .back-eg{color:var(--mute);font-style:italic;margin-top:8px}
.flash .box{position:absolute;top:12px;right:16px;font-size:11px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rate .no{background:var(--crit-soft);color:var(--crit)}
.rate .yes{background:var(--ok-soft);color:var(--ok)}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;background:var(--surf);min-width:0}
.kpi.hi{background:var(--sun-soft);border-color:transparent}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:30px;font-weight:350;letter-spacing:-.03em;line-height:1}
.kpi.hi .v{color:var(--sun-ink)}
.kpi .d{font-size:12px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.bl{display:grid;gap:6px}

<script>
const NEW_LESSONS = [
{
  id:"presente", lvl:"A2", title:"Il presente", sub:"Verbos regulares, -isc- y los irregulares de cada día",
  grammar:`
    <h3>Tres conjugaciones y un truco</h3>
    <p>Los verbos italianos terminan en <b>-are</b>, <b>-ere</b> o <b>-ire</b>. Quita la terminación y añade:</p>
    <div class="tbl"><table>
      <tr><th></th><th>parlare</th><th>prendere</th><th>dormire</th><th>finire (-isc-)</th></tr>
      <tr><td class="p">io</td><td>parl<em>o</em></td><td>prend<em>o</em></td><td>dorm<em>o</em></td><td>fin<em>isco</em></td></tr>
      <tr><td class="p">tu</td><td>parl<em>i</em></td><td>prend<em>i</em></td><td>dorm<em>i</em></td><td>fin<em>isci</em></td></tr>
      <tr><td class="p">lui / lei</td><td>parl<em>a</em></td><td>prend<em>e</em></td><td>dorm<em>e</em></td><td>fin<em>isce</em></td></tr>
      <tr><td class="p">noi</td><td>parl<em>iamo</em></td><td>prend<em>iamo</em></td><td>dorm<em>iamo</em></td><td>fin<em>iamo</em></td></tr>
      <tr><td class="p">voi</td><td>parl<em>ate</em></td><td>prend<em>ete</em></td><td>dorm<em>ite</em></td><td>fin<em>ite</em></td></tr>
      <tr><td class="p">loro</td><td>parl<em>ano</em></td><td>prend<em>ono</em></td><td>dorm<em>ono</em></td><td>fin<em>iscono</em></td></tr>
    </table></div>
    <p><span class="mark">noi</span> siempre termina en <b>-iamo</b>, sea cual sea la conjugación. Es la forma más fácil.</p>
    <h4>Verbos en -isc-</h4>
    <p>Muchos verbos en -ire meten <b>-isc-</b> en io, tu, lui y loro: <i>capire, finire, preferire, pulire, spedire</i>. Noi y voi quedan normales.</p>
    <h4>Ortografía: -care, -gare, -iare</h4>
    <p>Cercare y pagare añaden <b>h</b> para mantener el sonido duro: <i>tu cerchi, noi paghiamo</i>. Mangiare y studiare no duplican la i: <i>tu mangi, noi studiamo</i>.</p>
    <h4>Irregulares imprescindibles</h4>
    <div class="tbl"><table>
      <tr><th></th><th>andare</th><th>fare</th><th>venire</th><th>uscire</th><th>rimanere</th></tr>
      <tr><td class="p">io</td><td>vado</td><td>faccio</td><td>vengo</td><td>esco</td><td>rimango</td></tr>
      <tr><td class="p">tu</td><td>vai</td><td>fai</td><td>vieni</td><td>esci</td><td>rimani</td></tr>
      <tr><td class="p">lui / lei</td><td>va</td><td>fa</td><td>viene</td><td>esce</td><td>rimane</td></tr>
      <tr><td class="p">noi</td><td>andiamo</td><td>facciamo</td><td>veniamo</td><td>usciamo</td><td>rimaniamo</td></tr>
      <tr><td class="p">voi</td><td>andate</td><td>fate</td><td>venite</td><td>uscite</td><td>rimanete</td></tr>
      <tr><td class="p">loro</td><td>vanno</td><td>fanno</td><td>vengono</td><td>escono</td><td>rimangono</td></tr>
    </table></div>
    <p>En el <b>Coniugatore</b> tienes todos: essere, avere, dire, stare, dare, potere, volere, dovere, sapere, bere, tenere…</p>
    <div class="trap"><b>Trampa para hispanohablantes:</b> «tener hambre / sed / frío / razón» se dice con <i>avere</i>: ho fame, ho sete, ho freddo, hai ragione. <i>Tenere</i> significa sujetar o guardar, no poseer.</div>`,
  vocab:[
    ["uscire","salir","Stasera esco con le amiche."],
    ["rimanere","quedarse","Rimaniamo a casa domenica."],
    ["sapere","saber (un dato, hacer algo)","Sai nuotare?"],
    ["conoscere","conocer (persona, lugar)","Conosco bene Milano."],
    ["bere","beber","Bevo un caffè al bar."],
    ["capire","entender","Scusi, non capisco."],
    ["preferire","preferir","Preferisco il treno all'aereo."],
    ["avere fame / sete","tener hambre / sed","Ho una fame da lupi!"],
    ["avere ragione","tener razón","Hai ragione tu."],
    ["fare la spesa","hacer la compra","Faccio la spesa al mercato."],
    ["stare per","estar a punto de","Il treno sta per partire."],
    ["tenere","sujetar, guardar","Tieni la borsa, per favore.",true]
  ],
  ex:[
    {t:"mc",q:"Stasera noi ___ con gli amici.",o:["esciamo","usciamo","uscimo","escono"],a:1,why:"Uscire es irregular (esco, esci, esce…) pero noi vuelve a la raíz: usciamo."},
    {t:"fill",q:"Io non ___ la risposta.",hint:"sapere",a:["so"],why:"Sapere: so, sai, sa, sappiamo, sapete, sanno."},
    {t:"mc",q:"Tu ___ il caffè o il tè?",hint:"preferire",o:["preferi","preferisci","preferisce","preferite"],a:1,why:"Verbo en -isc-: tu preferisci."},
    {t:"fill",q:"Loro ___ a Roma fino a domenica.",hint:"rimanere",a:["rimangono"],why:"Rimanere: rimango… rimangono (la g aparece en io y loro)."},
    {t:"mc",q:"«Tengo hambre» se dice…",o:["Tengo fame","Ho fame","Sono fame","Sto fame"],a:1,why:"Con sensaciones se usa avere: ho fame."},
    {t:"fill",q:"Voi ___ vino o birra?",hint:"bere",a:["bevete"],why:"Bere se conjuga sobre la raíz antigua bev-: bevete."},
    {t:"mc",q:"___ Marco da dieci anni.",o:["So","Conosco","Sappio","Conosci"],a:1,why:"Conocer a una persona es conoscere, no sapere."},
    {t:"fill",q:"Noi ___ sempre il conto in contanti.",hint:"pagare",a:["paghiamo"],why:"Pagare añade h delante de i: paghiamo."},
    {t:"fill",q:"Lei ___ subito tutto.",hint:"capire",a:["capisce"],why:"Capire lleva -isc-: capisce."},
    {t:"tr",q:"Traduce: Ellos vienen mañana.",a:["vengono domani","loro vengono domani","domani vengono"],why:"Venire: vengo, vieni, viene, veniamo, venite, vengono."}
  ]
},
{
  id:"avverbi", lvl:"A2", title:"Gli avverbi", sub:"Formación en -mente, già, ancora, mai, più y molto",
  grammar:`
    <h3>Cómo se forman</h3>
    <p>Igual que en español: el adjetivo en femenino + <b>-mente</b>.</p>
    <div class="tbl"><table>
      <tr><th>Adjetivo</th><th>Regla</th><th>Adverbio</th></tr>
      <tr><td>lento</td><td>femenino + mente</td><td>lent<em>amente</em></td></tr>
      <tr><td>veloce</td><td>-e + mente</td><td>veloce<em>mente</em></td></tr>
      <tr><td>facile, regolare</td><td><span class="mark">-le / -re pierden la e</span></td><td>facil<em>mente</em>, regolar<em>mente</em></td></tr>
      <tr><td>buono / cattivo</td><td>irregulares</td><td><em>bene</em> / <em>male</em></td></tr>
    </table></div>
    <h4>Meglio o migliore</h4>
    <p><b>Meglio / peggio</b> son adverbios (acompañan a un verbo). <b>Migliore / peggiore</b> son adjetivos (acompañan a un nombre).</p>
    <div class="ex">Oggi sto meglio. Questa è la pizza migliore di Napoli.<span>Hoy estoy mejor. Esta es la mejor pizza de Nápoles.</span></div>
    <h4>Posición con tiempos compuestos</h4>
    <p><i>già, ancora, sempre, mai, appena, più</i> van <span class="mark">entre el auxiliar y el participio</span>:</p>
    <div class="ex">Ho già mangiato. Non sono mai stata a Bari. Non ho ancora finito.<span>Ya he comido. Nunca he estado en Bari. Todavía no he terminado.</span></div>
    <div class="tbl"><table>
      <tr><th>Español</th><th>Italiano</th></tr>
      <tr><td>ya</td><td><em>già</em></td></tr>
      <tr><td>todavía / aún</td><td><em>ancora</em></td></tr>
      <tr><td>todavía no</td><td><em>non… ancora</em></td></tr>
      <tr><td>ya no</td><td><em>non… più</em></td></tr>
      <tr><td>nunca</td><td><em>non… mai</em></td></tr>
      <tr><td>acabo de</td><td><em>ho appena</em> + participio</td></tr>
    </table></div>
    <h4>Molto, poco, tanto, troppo</h4>
    <p>Como adverbio son <b>invariables</b>: <i>sono molto stanche</i>. Como adjetivo <b>concuerdan</b>: <i>molte persone, troppi turisti</i>.</p>
    <div class="trap"><b>Trampa para hispanohablantes:</b> «ya no» no es «già non», es <i>non… più</i>: non abito più a Roma.</div>`,
  vocab:[
    ["già","ya","Hai già prenotato?"],
    ["ancora","todavía, aún / otra vez","Non è ancora arrivato. Ancora un caffè!"],
    ["non… più","ya no","Non fumo più."],
    ["non… mai","nunca","Non sono mai stata in Puglia."],
    ["appena","acabar de / apenas","Sono appena arrivata."],
    ["subito","enseguida","Arrivo subito!"],
    ["spesso","a menudo","Andiamo spesso al mare."],
    ["ogni tanto","de vez en cuando","Ogni tanto mangio fuori."],
    ["di solito","normalmente, por lo general","Di solito pranzo all'una."],
    ["purtroppo","desgraciadamente, por desgracia","Purtroppo il museo è chiuso."],
    ["apposta","a propósito, adrede","L'ha fatto apposta!"],
    ["magari","ojalá / quizás","Magari! / Magari domani piove."]
  ],
  ex:[
    {t:"fill",q:"Il cameriere parla molto ___ .",hint:"lento → adverbio",a:["lentamente"],why:"Femenino lenta + mente."},
    {t:"fill",q:"Ho trovato l'albergo ___ .",hint:"facile → adverbio",a:["facilmente"],why:"Los adjetivos en -le pierden la e: facilmente."},
    {t:"mc",q:"«Ya no vivo en Milán» se dice…",o:["Già non vivo a Milano","Non vivo più a Milano","Non vivo già a Milano","Non vivo ancora a Milano"],a:1,why:"Ya no = non… più."},
    {t:"mc",q:"Oggi mi sento ___ di ieri.",o:["migliore","meglio","più bene","più buono"],a:1,why:"Acompaña al verbo sentirsi → adverbio: meglio."},
    {t:"mc",q:"Questo è il gelato ___ della città.",o:["meglio","migliore","bene","più bene"],a:1,why:"Acompaña a un nombre (il gelato) → adjetivo: migliore."},
    {t:"mc",q:"Le ragazze sono ___ stanche.",o:["molte","molto","molta","molti"],a:1,why:"Molto delante de adjetivo es adverbio e invariable."},
    {t:"fill",q:"In spiaggia ci sono ___ persone.",hint:"molto, concuerda",a:["molte"],why:"Delante de un nombre es adjetivo y concuerda: molte persone."},
    {t:"order",q:"Ordena la frase: Nunca he estado en Sicilia.",a:"Non sono mai stata in Sicilia"},
    {t:"tr",q:"Traduce: Todavía no he terminado.",a:["non ho ancora finito","ancora non ho finito"],why:"Non + aux + ancora + participio."},
    {t:"mc",q:"«Sono appena arrivata» significa…",o:["Apenas he llegado a tiempo","Acabo de llegar","Casi he llegado","He llegado tarde"],a:1,why:"Avere/essere + appena + participio = acabar de."}
  ]
},
{
  id:"preposizioni", lvl:"A2", title:"Le preposizioni articolate", sub:"del, al, dal, nel, sul… y cuándo usar a, in, da",
  grammar:`
    <h3>Preposición + artículo = una palabra</h3>
    <p>Di, a, da, in y su se funden con el artículo determinado. No es opcional: <i>vado al mare</i>, nunca «a il mare».</p>
    <div class="tbl"><table>
      <tr><th></th><th>il</th><th>lo</th><th>l'</th><th>la</th><th>i</th><th>gli</th><th>le</th></tr>
      <tr><td class="p">di</td><td>del</td><td>dello</td><td>dell'</td><td>della</td><td>dei</td><td>degli</td><td>delle</td></tr>
      <tr><td class="p">a</td><td>al</td><td>allo</td><td>all'</td><td>alla</td><td>ai</td><td>agli</td><td>alle</td></tr>
      <tr><td class="p">da</td><td>dal</td><td>dallo</td><td>dall'</td><td>dalla</td><td>dai</td><td>dagli</td><td>dalle</td></tr>
      <tr><td class="p">in</td><td>nel</td><td>nello</td><td>nell'</td><td>nella</td><td>nei</td><td>negli</td><td>nelle</td></tr>
      <tr><td class="p">su</td><td>sul</td><td>sullo</td><td>sull'</td><td>sulla</td><td>sui</td><td>sugli</td><td>sulle</td></tr>
    </table></div>
    <h4>A o in</h4>
    <p><b>a</b> con ciudades (<i>a Roma, a Madrid</i>). <b>in</b> con países, regiones y muchos lugares sin artículo (<i>in Italia, in Toscana, in centro, in banca, in macchina</i>).</p>
    <h4>Da</h4>
    <p><span class="mark">da + persona</span> = a casa de / a la consulta de: <i>vado dal medico, ceniamo da Marco</i>.</p>
    <p><span class="mark">da + tiempo</span> = desde hace: <i>studio italiano da due anni</i> (llevo dos años estudiando).</p>
    <p><span class="mark">da + infinitivo</span> = para: <i>qualcosa da bere</i>.</p>
    <h4>Tra / fra</h4>
    <p>Para el futuro: <i>il treno parte tra dieci minuti</i> (dentro de diez minutos).</p>
    <div class="trap"><b>Trampa para hispanohablantes:</b> «hace tres años» (pasado) es <i>tre anni fa</i>; «desde hace tres años» (sigue) es <i>da tre anni</i>.</div>`,
  vocab:[
    ["dal medico","al médico","Domani vado dal medico."],
    ["dal parrucchiere","a la peluquería","Sono dal parrucchiere."],
    ["in centro","en el centro / al centro","Andiamo in centro a piedi?"],
    ["in macchina","en coche","Vado in macchina."],
    ["a piedi","a pie","È vicino, si va a piedi."],
    ["al mare / in montagna","a la playa / a la montaña","D'estate al mare, d'inverno in montagna."],
    ["tra un'ora","dentro de una hora","Ci vediamo tra un'ora."],

    <h3>Parlerò, prenderò, partirò</h3>
    <p>Se toma el infinitivo sin la -e final. En los verbos en -are la <b>a</b> se convierte en <b>e</b>.</p>

      <tr><th></th><th>parlare</th><th>prendere</th><th>partire</th></tr>
      <tr><td class="p">io</td><td>parler<em>ò</em></td><td>prender<em>ò</em></td><td>partir<em>ò</em></td></tr>
      <tr><td class="p">tu</td><td>parler<em>ai</em></td><td>prender<em>ai</em></td><td>partir<em>ai</em></td></tr>
      <tr><td class="p">lui / lei</td><td>parler<em>à</em></td><td>prender<em>à</em></td><td>partir<em>à</em></td></tr>
      <tr><td class="p">noi</td><td>parler<em>emo</em></td><td>prender<em>emo</em></td><td>partir<em>emo</em></td></tr>
      <tr><td class="p">voi</td><td>parler<em>ete</em></td><td>prender<em>ete</em></td><td>partir<em>ete</em></td></tr>
      <tr><td class="p">loro</td><td>parler<em>anno</em></td><td>prender<em>anno</em></td><td>partir<em>anno</em></td></tr>

    <p>Ortografía: <i>cercare → cercherò, pagare → pagherò, mangiare → mangerò, cominciare → comincerò</i>.</p>

    <h3>Vorrei, potrebbe, dovresti</h3>
    <p>Usa <span class="mark">la misma raíz que el futuro</span> con otras terminaciones. Si sabes el futuro, sabes el condicional.</p>
    <div class="tbl"><table>
      <tr><th></th><th>parlare</th><th>volere</th><th>essere</th></tr>
      <tr><td class="p">io</td><td>parler<em>ei</em></td><td>vorr<em>ei</em></td><td>sar<em>ei</em></td></tr>
      <tr><td class="p">tu</td><td>parler<em>esti</em></td><td>vorr<em>esti</em></td><td>sar<em>esti</em></td></tr>
      <tr><td class="p">lui / lei</td><td>parler<em>ebbe</em></td><td>vorr<em>ebbe</em></td><td>sar<em>ebbe</em></td></tr>
      <tr><td class="p">noi</td><td>parler<em>emmo</em></td><td>vorr<em>emmo</em></td><td>sar<em>emmo</em></td></tr>
      <tr><td class="p">voi</td><td>parler<em>este</em></td><td>vorr<em>este</em></td><td>sar<em>este</em></td></tr>
      <tr><td class="p">loro</td><td>parler<em>ebbero</em></td><td>vorr<em>ebbero</em></td><td>sar<em>ebbero</em></td></tr>
    </table></div>
    <p>Ojo a <b>noi</b>: futuro <i>parleremo</i> (una m), condicional <i>parleremmo</i> (dos m).</p>
    <h4>Usos</h4>

{
  id:"congiuntivo", lvl:"B1", title:"Il congiuntivo presente", sub:"Penso che sia, spero che tu venga",
  grammar:`
    <h3>El subjuntivo, más que en español</h3>
    <p>El italiano usa congiuntivo en sitios donde el español usa indicativo, sobre todo con <span class="mark">verbos de opinión</span>.</p>
    <div class="tbl"><table>
      <tr><th></th><th>parlare</th><th>prendere</th><th>partire</th><th>finire</th></tr>
      <tr><td class="p">che io</td><td>parl<em>i</em></td><td>prend<em>a</em></td><td>part<em>a</em></td><td>fin<em>isca</em></td></tr>
      <tr><td class="p">che tu</td><td>parl<em>i</em></td><td>prend<em>a</em></td><td>part<em>a</em></td><td>fin<em>isca</em></td></tr>
      <tr><td class="p">che lui / lei</td><td>parl<em>i</em></td><td>prend<em>a</em></td><td>part<em>a</em></td><td>fin<em>isca</em></td></tr>
      <tr><td class="p">che noi</td><td>parl<em>iamo</em></td><td>prend<em>iamo</em></td><td>part<em>iamo</em></td><td>fin<em>iamo</em></td></tr>
      <tr><td class="p">che voi</td><td>parl<em>iate</em></td><td>prend<em>iate</em></td><td>part<em>iate</em></td><td>fin<em>iate</em></td></tr>
      <tr><td class="p">che loro</td><td>parl<em>ino</em></td><td>prend<em>ano</em></td><td>part<em>ano</em></td><td>fin<em>iscano</em></td></tr>
    </table></div>
    <p>Las tres personas del singular son iguales, por eso a menudo se pone el pronombre: <i>che tu sia</i>.</p>
    <p>Irregulares clave: <i>essere → sia, avere → abbia, fare → faccia, andare → vada, stare → stia, venire → venga, potere → possa, volere → voglia, sapere → sappia, dovere → debba</i>.</p>
    <h4>Cuándo</h4>
    <p><b>Opinión y creencia:</b> penso che, credo che, mi sembra che, immagino che.</p>
    <p><b>Deseo y voluntad:</b> voglio che, spero che, preferisco che.</p>
    <p><b>Emoción:</b> sono contenta che, mi dispiace che, ho paura che.</p>
    <p><b>Impersonales:</b> è importante che, è possibile che, bisogna che.</p>
    <p><b>Conjunciones:</b> benché, sebbene, prima che, affinché, purché, a meno che.</p>
    <h4>Mismo sujeto: di + infinitivo</h4>
    <div class="ex">Penso di partire domani. (no «penso che io parta»)<span>Pienso irme mañana.</span></div>
    <div class="trap"><b>Trampa para hispanohablantes:</b> «Creo que es tarde» → <i>Credo che sia tardi</i>. En español va en indicativo; en italiano, congiuntivo.</div>`,

  id:"albergo", lvl:"A2", title:"In albergo", sub:"Passato prossimo: ¿essere o avere?",
  grammar:`
    <h3>Essere o avere</h3>
    <p>En español el pretérito perfecto siempre va con <i>haber</i>. En italiano hay dos auxiliares, y aquí está la mayoría de errores.</p>
    <p><b>Avere</b> con la mayoría de verbos que llevan objeto directo: <i>ho prenotato, abbiamo pagato, hai visto</i>.</p>
    <p><b>Essere</b> con verbos de <span class="mark">movimiento o cambio de estado</span> y con todos los reflexivos: andare, arrivare, partire, uscire, entrare, tornare, restare, rimanere, stare, essere, diventare, nascere, morire, svegliarsi…</p>
    <p>Con essere, el participio <span class="mark">concuerda con el sujeto</span>:</p>
    <div class="ex">Laura è arrivata. Noi siamo partiti. Le ragazze sono uscite.<span>Laura ha llegado. Nos hemos ido. Las chicas han salido.</span></div>
    <div class="ex">Mi sono svegliata alle sette.<span>Me he despertado a las siete.</span></div>
    <p>Participios irregulares que vas a usar mucho:</p>
    <div class="tbl"><table>
      <tr><th>Infinitivo</th><th>Participio</th><th>Infinitivo</th><th>Participio</th></tr>
      <tr><td>fare</td><td><em>fatto</em></td><td>prendere</td><td><em>preso</em></td></tr>
      <tr><td>vedere</td><td><em>visto</em></td><td>mettere</td><td><em>messo</em></td></tr>
      <tr><td>chiedere</td><td><em>chiesto</em></td><td>aprire</td><td><em>aperto</em></td></tr>
      <tr><td>rimanere</td><td><em>rimasto</em></td><td>scendere</td><td><em>sceso</em></td></tr>
      <tr><td>essere / stare</td><td><em>stato</em></td><td>venire</td><td><em>venuto</em></td></tr>
    </table></div>
    <div class="trap"><b>Trampa para hispanohablantes:</b> «Hemos estado en Roma» es <i>siamo stati a Roma</i>, nunca «abbiamo stato».</div>`,
  vocab:[
    ["la camera matrimoniale","habitación doble con cama de matrimonio","Ho prenotato una camera matrimoniale."],
    ["la camera singola","habitación individual","Una singola per due notti."],
    ["la colazione","el desayuno","La colazione è inclusa?"],
    ["la chiave","la llave","Ho lasciato la chiave alla reception."],
    ["le valigie","las maletas","Possiamo lasciare le valigie qui?"],
    ["salire","subir","Sono salita in camera con l'ascensore.",true],
    ["l'ascensore","el ascensor","L'ascensore non funziona."],
    ["la sveglia","el despertador / la llamada para despertar","Mi può dare la sveglia alle sei?"],
    ["le lenzuola","las sábanas","Potete cambiare le lenzuola?"],
    ["la tassa di soggiorno","la tasa turística","La tassa di soggiorno si paga in contanti."],
    ["lasciare la camera","dejar la habitación (hacer el check-out)","Dobbiamo lasciare la camera entro le undici."],
    ["la ricevuta","el recibo / la factura simplificada","Mi può fare la ricevuta?"]
  ],
  ex:[
    {t:"mc",q:"Ieri sera ___ arrivati tardi in albergo.",o:["abbiamo","siamo","avete","sono"],a:1,why:"Arrivare es de movimiento → essere. «Arrivati» plural → noi siamo."},

{
  id:"indicazioni", lvl:"A2", title:"Chiedere indicazioni", sub:"Imperativo (tu, Lei, voi) y pronombres",
  grammar:`
    <h3>Gira, giri, girate</h3>
    <p>Para dar o entender indicaciones necesitas el imperativo. Con desconocidos los italianos usan <b>Lei</b> (usted), que se forma como el subjuntivo.</p>
    <div class="tbl"><table>
      <tr><th></th><th>-are (girare)</th><th>-ere (prendere)</th><th>-ire (sentire)</th></tr>
      <tr><td>tu</td><td><em>gira</em></td><td><em>prendi</em></td><td><em>senti</em></td></tr>
      <tr><td>Lei</td><td><em>giri</em></td><td><em>prenda</em></td><td><em>senta</em></td></tr>
      <tr><td>voi</td><td><em>girate</em></td><td><em>prendete</em></td><td><em>sentite</em></td></tr>
    </table></div>
    <p>Fíjate en el cruce: con -are, <i>tu</i> termina en -a y <i>Lei</i> en -i. Con -ere/-ire, al revés.</p>
    <p><b>Negativo con tu:</b> non + infinitivo. <span class="mark">Non girare!</span> (¡No gires!)</p>
    <p><b>Irregulares frecuentes:</b> andare → va' / vada · fare → fa' / faccia · dire → di' / dica · stare → sta' / stia.</p>
    <p><b>Pronombres:</b> con <i>tu</i> y <i>voi</i> van pegados detrás; con <i>Lei</i> van delante.</p>
    <div class="ex">Il biglietto? Compralo dal tabaccaio. / Lo compri dal tabaccaio.<span>¿El billete? Cómpralo en el estanco. / Cómprelo en el estanco.</span></div>
    <p>Con va', fa', di', sta' la consonante del pronombre se dobla: <i>dimmi, fammi vedere</i>.</p>
    <div class="trap"><b>Para el viaje:</b> los billetes de autobús en Italia se compran antes de subir, en el <i>tabaccaio</i> o en el quiosco, y hay que <i>convalidarli</i> al subir.</div>`,

{
  id:"viaggio", lvl:"B1", title:"Raccontare un viaggio", sub:"Imperfetto y passato prossimo",
  grammar:`
    <h3>Era bellissimo, abbiamo visto…</h3>
    <p>La lógica es muy parecida al español: el <b>imperfetto</b> describe el escenario y lo habitual; el <b>passato prossimo</b> cuenta lo que pasó. Donde en España dirías «ayer fuimos», en italiano normalmente se usa el passato prossimo: <i>ieri siamo andati</i>.</p>
    <div class="tbl"><table>
      <tr><th></th><th>-are (andare)</th><th>-ere (vedere)</th><th>essere</th></tr>
      <tr><td>io</td><td><em>andavo</em></td><td><em>vedevo</em></td><td><em>ero</em></td></tr>
      <tr><td>tu</td><td>andavi</td><td>vedevi</td><td>eri</td></tr>
      <tr><td>lui / lei</td><td>andava</td><td>vedeva</td><td>era</td></tr>
      <tr><td>noi</td><td>andavamo</td><td>vedevamo</td><td>eravamo</td></tr>
      <tr><td>voi</td><td>andavate</td><td>vedevate</td><td>eravate</td></tr>
      <tr><td>loro</td><td>andavano</td><td>vedevano</td><td>erano</td></tr>
    </table></div>
    <p><b>Imperfetto:</b> descripción (faceva caldo, il paesaggio era bello), costumbres (ogni estate andavo al mare), acción en curso (mentre camminavamo…).</p>
    <p><b>Passato prossimo:</b> hechos concretos y terminados (abbiamo noleggiato una macchina, siamo arrivati a Positano).</p>
    <div class="ex">Mentre guardavamo il tramonto, ha cominciato a piovere.<span>Mientras mirábamos el atardecer, empezó a llover.</span></div>
    <div class="trap"><b>Atajo mental:</b> si en español usarías «-aba / -ía», casi seguro que en italiano es imperfetto. Si usarías «fui / fuimos / he ido», es passato prossimo.</div>`,
  vocab:[

    ["il paesaggio","el paisaje","Il paesaggio era spettacolare."],
    ["il borgo","pueblo pequeño con encanto, casco antiguo","Abbiamo visitato un borgo medievale."],

    ["la sagra","fiesta popular de un pueblo, dedicada a un producto","Siamo andati alla sagra del tartufo."],
    ["il tramonto","el atardecer, la puesta de sol","Che tramonto!"],
    ["godersi","disfrutar de","Ci siamo goduti la vista."],
    ["sbagliare strada","equivocarse de camino","Abbiamo sbagliato strada due volte."],
    ["guardare","mirar (no «guardar»)","Guardavamo il mare.",true]
  ],
  ex:[

{
  id:"pronomi-indiretti", lvl:"B1", title:"Pronomi indiretti e combinati", titleEs:"Pronombres indirectos y combinados", sub:"mi, ti, gli, le… y glielo, me lo, te ne",
  grammar:`
    <h3>A quién: mi, ti, gli, le</h3>
    <p>Los pronombres indirectos responden a «¿a quién?». Ojo: en italiano se distingue <b>gli</b> (a él) de <b>le</b> (a ella).</p>
    <div class="tbl"><table>
      <tr><th></th><th>Indirecto</th><th>Ejemplo</th></tr>
      <tr><td class="p">a me</td><td><em>mi</em></td><td>Mi piace il gelato.</td></tr>
      <tr><td class="p">a te</td><td><em>ti</em></td><td>Ti scrivo domani.</td></tr>
      <tr><td class="p">a lui</td><td><em>gli</em></td><td>Gli telefono stasera.</td></tr>
      <tr><td class="p">a lei / a Lei</td><td><em>le / Le</em></td><td>Le porto un caffè, signora?</td></tr>
      <tr><td class="p">a noi / a voi</td><td><em>ci / vi</em></td><td>Ci mandano le foto.</td></tr>
      <tr><td class="p">a loro</td><td><em>gli</em></td><td>Gli ho detto di venire.</td></tr>
    </table></div>
    <h4>Combinados: indirecto + directo</h4>
    <p>Cuando van juntos, el indirecto va primero y cambia la <b>i</b> por <b>e</b>: mi → <em>me</em>, ti → <em>te</em>, ci → <em>ce</em>, vi → <em>ve</em>. Gli, le y Le se convierten en <span class="mark">glie-</span> y se escriben en una sola palabra.</p>
    <div class="tbl"><table>
      <tr><th></th><th>lo</th><th>la</th><th>li</th><th>le</th><th>ne</th></tr>
      <tr><td class="p">mi</td><td>me lo</td><td>me la</td><td>me li</td><td>me le</td><td>me ne</td></tr>
      <tr><td class="p">ti</td><td>te lo</td><td>te la</td><td>te li</td><td>te le</td><td>te ne</td></tr>
      <tr><td class="p">gli / le / Le</td><td><em>glielo</em></td><td><em>gliela</em></td><td><em>glieli</em></td><td><em>gliele</em></td><td><em>gliene</em></td></tr>
      <tr><td class="p">ci / vi</td><td>ce lo / ve lo</td><td>ce la / ve la</td><td>ce li / ve li</td><td>ce le / ve le</td><td>ce ne / ve ne</td></tr>
    </table></div>
    <h4>Posición</h4>
    <p>Delante del verbo conjugado, o pegados al infinitivo, al gerundio y al imperativo de tu/voi: <i>Te lo voglio dire = Voglio dirtelo. Dammelo!</i></p>
    <p>Con el passato prossimo el participio concuerda con el directo: <i>Le chiavi? Te le ho date.</i></p>
    <div class="trap"><b>Trampa para hispanohablantes:</b> el «se lo» español es <i>glielo</i> en italiano, sirva para él, ella o usted. Y <i>mancare</i> funciona como piacere: «te echo de menos» es <i>mi manchi</i> (tú me faltas).</div>`,

{
  id:"ci-ne", lvl:"B1", title:"Ci e ne", titleEs:"Las partículas ci y ne", sub:"Ci vado, ne parliamo, ci vuole, ce l'ho",
  grammar:`
    <h3>Dos palabras pequeñas que están en todas partes</h3>
    <p><b>Ci</b> sustituye un lugar o algo introducido por <b>a</b> (o in, su). <b>Ne</b> sustituye algo introducido por <b>di</b> o <b>da</b>, además de las cantidades que ya conoces.</p>
    <div class="tbl"><table>
      <tr><th>Verbo + preposición</th><th>Con partícula</th><th>Español</th></tr>
      <tr><td>andare a Roma</td><td><em>ci</em> vado</td><td>voy (allí)</td></tr>
      <tr><td>pensare a qualcosa</td><td><em>ci</em> penso io</td><td>me encargo yo</td></tr>
      <tr><td>credere a qualcosa</td><td>non <em>ci</em> credo</td><td>no me lo creo</td></tr>
      <tr><td>riuscire a fare</td><td>non <em>ci</em> riesco</td><td>no lo consigo</td></tr>
      <tr><td>parlare di qualcosa</td><td><em>ne</em> parliamo dopo</td><td>lo hablamos luego</td></tr>
      <tr><td>avere bisogno di</td><td>non <em>ne</em> ho bisogno</td><td>no lo necesito</td></tr>
      <tr><td>pensare di (opinión)</td><td>che <em>ne</em> pensi?</td><td>¿qué te parece?</td></tr>
      <tr><td>essere sicuro di</td><td><em>ne</em> sono sicura</td><td>estoy segura</td></tr>
    </table></div>
    <h4>Expresiones fijas con ci</h4>
    <p><b>Ci vuole / ci vogliono</b> = hace(n) falta, se tarda: <i>Ci vogliono due ore.</i></p>
    <p><b>Metterci</b> = tardar (una persona): <i>Ci metto dieci minuti.</i></p>
    <p><b>Averci</b> en lengua hablada: <i>Il biglietto? Sì, ce l'ho.</i></p>
    <h4>Expresiones fijas con ne</h4>
    <p><b>Andarsene</b> = irse: <i>Me ne vado.</i> <b>Non poterne più</b> = no poder más: <i>Non ne posso più!</i></p>

{
  id:"trapassato", lvl:"B1", title:"Il trapassato prossimo", titleEs:"El pluscuamperfecto", sub:"Avevo già mangiato, era appena partito",
  grammar:`
    <h3>El pasado del pasado</h3>
    <p>Se forma con el <b>imperfetto de avere o essere</b> + participio. Las reglas del auxiliar y la concordancia son las mismas que en el passato prossimo.</p>
    <div class="tbl"><table>
      <tr><th></th><th>mangiare (avere)</th><th>partire (essere)</th></tr>
      <tr><td class="p">io</td><td>avevo mangiato</td><td>ero partito/a</td></tr>
      <tr><td class="p">tu</td><td>avevi mangiato</td><td>eri partito/a</td></tr>
      <tr><td class="p">lui / lei</td><td>aveva mangiato</td><td>era partito/a</td></tr>
      <tr><td class="p">noi</td><td>avevamo mangiato</td><td>eravamo partiti/e</td></tr>
      <tr><td class="p">voi</td><td>avevate mangiato</td><td>eravate partiti/e</td></tr>
      <tr><td class="p">loro</td><td>avevano mangiato</td><td>erano partiti/e</td></tr>
    </table></div>
    <h4>Cuándo</h4>
    <p>Para una acción anterior a otra acción pasada, igual que «había + participio»:</p>
    <div class="ex">Quando sono arrivata alla stazione, il treno era già partito.<span>Cuando llegué a la estación, el tren ya había salido.</span></div>
    <div class="ex">Non avevo mai visto Venezia prima di quel viaggio.<span>Nunca había visto Venecia antes de aquel viaje.</span></div>
    <p>Va muy a menudo con <i>già, appena, mai, ancora</i>, colocados entre el auxiliar y el participio.</p>
    <div class="trap"><b>Trampa para hispanohablantes:</b> en español a veces se simplifica («cuando llegué, el tren ya salió»). En italiano la anterioridad se marca casi siempre: <i>era già partito</i>.</div>`,
  vocab:[
    ["prima","antes","Non l'avevo mai visto prima.","No lo había visto nunca antes."],
    ["già","ya","Avevamo già cenato.","Ya habíamos cenado."],

    ["perdere il treno","perder el tren","Avevo perso il treno.","Había perdido el tren."],
    ["dimenticare","olvidar","Avevo dimenticato le chiavi.","Me había olvidado las llaves."],
    ["accorgersi di","darse cuenta de","Mi sono accorta che avevo sbagliato.","Me di cuenta de que me había equivocado."],
    ["succedere","pasar, ocurrir","Cos'era successo?","¿Qué había pasado?"],
    ["raccontare","contar","Mi ha raccontato che era stata in Giappone.","Me contó que había estado en Japón."],
    ["promettere","prometer","Mi aveva promesso di venire.","Me había prometido venir."],
    ["nel frattempo","mientras tanto","Nel frattempo era arrivata Giulia.","Mientras tanto había llegado Giulia."],
    ["ormai","ya (a esas alturas)","Ormai era troppo tardi.","Ya era demasiado tarde."],
    ["fino ad allora","hasta entonces","Fino ad allora non avevo mai viaggiato da sola.","Hasta entonces nunca había viajado sola."]
  ],
  ex:[
    {t:"mc",q:"Quando sono arrivata, il treno ___ già partito.",o:["aveva","era","è","ha"],a:1,why:"Partire va con essere: era partito."},
    {t:"fill",q:"Non ___ mai visto il mare prima di quel viaggio.",hint:"io, avere",a:["avevo"],why:"Trapassato: avevo visto."},

    {t:"fill",q:"Eravamo ___ arrivati quando è cominciato a piovere.",hint:"acabábamos de",a:["appena"],why:"Ero appena + participio = acababa de."},

{
  id:"gerundio", lvl:"B1", title:"Il gerundio e stare + gerundio", titleEs:"El gerundio y estar + gerundio", sub:"Sto mangiando, sbagliando s'impara, continuare a",
  grammar:`
    <h3>-ando, -endo</h3>
    <p>Los verbos en -are hacen <b>-ando</b>; los de -ere e -ire, <b>-endo</b>: <i>parlando, prendendo, dormendo</i>.</p>
    <p>Irregulares (salen de la raíz antigua): <i>fare → <em>facendo</em>, dire → <em>dicendo</em>, bere → <em>bevendo</em>, tradurre → <em>traducendo</em>, porre → <em>ponendo</em></i>.</p>
    <h4>Stare + gerundio</h4>
    <p>Solo para una acción <span class="mark">en curso en ese momento</span>: <i>Sto lavorando. Stavo leggendo quando hai chiamato.</i> El italiano lo usa menos que el español.</p>
    <h4>El gerundio solo</h4>
    <p>Expresa modo, causa o tiempo: <i>Sbagliando s'impara. Camminando ho trovato un bel bar.</i> Los pronombres se pegan detrás: <i>guardandolo</i>.</p>
    <h4>Perífrasis que no se traducen con gerundio</h4>
    <div class="tbl"><table>
      <tr><th>Español</th><th>Italiano</th></tr>
      <tr><td>seguir + gerundio</td><td><em>continuare a</em> + infinitivo: Continua a piovere.</td></tr>
      <tr><td>llevar + tiempo + gerundio</td><td>presente + <em>da</em>: Studio italiano da due anni.</td></tr>
      <tr><td>dejar de</td><td><em>smettere di</em>: Ho smesso di fumare.</td></tr>
      <tr><td>ponerse a</td><td><em>mettersi a</em>: Si è messa a ridere.</td></tr>
      <tr><td>estar a punto de</td><td><em>stare per</em>: Sto per uscire.</td></tr>
    </table></div>
    <div class="trap"><b>Trampa para hispanohablantes:</b> «Llevo dos años estudiando italiano» no es «sto studiando da due anni», sino <i>Studio italiano da due anni</i>.</div>`,

    ["continuare a","seguir + gerundio","Continua a piovere.","Sigue lloviendo."],

    ["facendo","haciendo","Facendo così risparmi tempo.","Haciéndolo así ahorras tiempo."],
    ["dicendo","diciendo","Che cosa stai dicendo?","¿Qué estás diciendo?"],
    ["bevendo","bebiendo","Stavamo bevendo un aperitivo.","Estábamos tomando un aperitivo."],
    ["andare avanti","seguir adelante","Andiamo avanti così.","Sigamos así."],
    ["mentre","mientras","Mentre cucinavo, ascoltavo la radio.","Mientras cocinaba, escuchaba la radio."],

  ex:[

{
  id:"si-impersonale", lvl:"B1", title:"Il si impersonale e passivante", titleEs:"El se impersonal y la pasiva refleja", sub:"Si mangia bene, si vendono case, ci si diverte",
  grammar:`
    <h3>Si + verbo</h3>
    <p>Como el «se» español impersonal: <i>In Italia si mangia bene.</i></p>
    <p>Si hay un objeto en plural, el verbo va en plural (<b>si passivante</b>): <i>Si vendono biglietti.</i></p>
    <h4>Tres detalles que no tiene el español</h4>
    <p><b>Con verbo reflexivo</b> se dice <span class="mark">ci si</span>: <i>In vacanza ci si rilassa.</i></p>
    <p><b>Con adjetivo</b>, el adjetivo va en <span class="mark">masculino plural</span>: <i>Quando si è stanchi, si sbaglia.</i></p>
    <p><b>En tiempos compuestos</b> el auxiliar es siempre essere: <i>Si è mangiato bene. Si sono vendute molte copie.</i></p>
    <h4>En los carteles</h4>
    <p><i>Affittasi, vendesi</i> (se alquila, se vende), <i>vietato fumare, si prega di non toccare</i>.</p>
    <div class="trap"><b>Trampa para hispanohablantes:</b> «Uno se cansa» no es «si si stanca» sino <i>ci si stanca</i>.</div>`,
  vocab:[
    ["si dice","se dice","Come si dice «gracias» in italiano?","¿Cómo se dice «gracias» en italiano?"],

    ["affittasi","se alquila","Affittasi appartamento in centro.","Se alquila piso en el centro."],
    ["vietato","prohibido","Vietato fumare.","Prohibido fumar."],
    ["si sa","ya se sabe","Si sa che a Napoli si mangia bene.","Ya se sabe que en Nápoles se come bien."],
    ["di solito si","normalmente se","Di solito si pranza all'una.","Normalmente se come a la una."],
    ["si prega di","se ruega","Si prega di non toccare.","Se ruega no tocar."],
    ["è meglio","es mejor","È meglio prenotare prima.","Es mejor reservar antes."],
    ["bisogna","hay que","Bisogna fare la fila.","Hay que hacer cola."],
    ["ci si vede","nos vemos","Ci si vede domani!","¡Nos vemos mañana!"]
  ],
  ex:[
    {t:"mc",q:"In questo negozio ___ prodotti tipici.",o:["si vende","si vendono","vendono si","si venduti"],a:1,why:"Objeto en plural → verbo en plural."},
    {t:"fill",q:"In vacanza ___ si rilassa.",hint:"rilassarsi es reflexivo",a:["ci"],why:"Reflexivo impersonal: ci si rilassa."},
    {t:"mc",q:"Quando ___ giovani, si ha tanta energia.",o:["si è","si sono","si siamo","ci si è"],a:0,why:"Si è + adjetivo en masculino plural."},

{
  id:"relativi", lvl:"B1", title:"I pronomi relativi", titleEs:"Los pronombres relativos", sub:"che, cui, il quale, chi, quello che",
  grammar:`
    <h3>Che y cui</h3>
    <p><b>Che</b> funciona como sujeto u objeto directo: <i>Il ragazzo che hai conosciuto…</i></p>
    <p>Detrás de una preposición se usa <span class="mark">cui</span>, nunca che: <i>la persona con cui parlo, la città in cui vivo, il motivo per cui…</i></p>
    <h4>Il quale</h4>
    <p>Más formal, sustituye a che o cui y concuerda: <i>il quale, la quale, i quali, le quali</i>. Con preposición se contrae: <i>della quale, ai quali</i>.</p>
    <h4>Il cui = cuyo</h4>
    <p>El artículo concuerda con lo poseído: <i>la signora il cui figlio…, l'autore la cui opera…</i></p>
    <div class="tbl"><table>
      <tr><th>Español</th><th>Italiano</th></tr>
      <tr><td>que</td><td><em>che</em></td></tr>
      <tr><td>con el que / en el que…</td><td><em>con cui / in cui</em></td></tr>
      <tr><td>cuyo</td><td><em>il cui</em></td></tr>
      <tr><td>quien, el que (genérico)</td><td><em>chi</em>: Chi cerca trova.</td></tr>
      <tr><td>lo que</td><td><em>quello che / ciò che</em></td></tr>
      <tr><td>lo cual (toda la frase)</td><td><em>il che</em></td></tr>
      <tr><td>donde</td><td><em>dove</em> o <em>in cui</em></td></tr>
    </table></div>
    <div class="trap"><b>Trampa para hispanohablantes:</b> «lo que quieras» no es «il che vuoi» sino <i>quello che vuoi</i>. «Il che» solo retoma una frase entera: <i>Ha piovuto, il che ha rovinato la gita.</i></div>`,
  vocab:[
    ["che","que","Il ragazzo che hai conosciuto è mio cugino.","El chico que conociste es mi primo."],
    ["cui","el que, el cual (tras preposición)","La ragione per cui sono qui.","La razón por la que estoy aquí."],
    ["il cui","cuyo","La signora il cui figlio vive a Roma.","La señora cuyo hijo vive en Roma."],
    ["il quale","el cual","Il cliente del quale ti ho parlato.","El cliente del que te hablé."],
    ["chi","quien, el que","Chi dorme non piglia pesci.","Camarón que se duerme se lo lleva la corriente."],
    ["quello che / ciò che","lo que","Fai quello che vuoi.","Haz lo que quieras."],
    ["il che","lo cual","Ha piovuto, il che ha rovinato la gita.","Llovió, lo cual arruinó la excursión."],
    ["dove","donde","Il paese dove sono nata.","El pueblo donde nací."],
    ["tutto quello che","todo lo que","È tutto quello che ho.","Es todo lo que tengo."],
    ["la ragione per cui","la razón por la que","Ecco la ragione per cui ti ho chiamato.","Esta es la razón por la que te he llamado."],
    ["il modo in cui","la manera en que","Mi piace il modo in cui parli.","Me gusta tu manera de hablar."],
    ["colui che","aquel que","Colui che arriva per ultimo paga.","El que llega último paga."]
  ],
  ex:[
    {t:"mc",q:"La città ___ abito è piccola.",o:["che","in cui","cui che","dove che"],a:1,why:"Tras preposición: in cui."},
    {t:"fill",q:"Il collega con ___ lavoro è simpatico.",a:["cui"],why:"Con + cui."},
    {t:"mc",q:"Ho fatto ___ mi hai detto.",o:["che","quello che","il che","cui"],a:1,why:"Lo que = quello che."},
    {t:"mc",q:"È la donna ___ marito è italiano. (cuyo)",o:["che","il cui","la cui","di cui il"],a:1,why:"Il cui concuerda con marito (masculino)."},
    {t:"fill",q:"___ cerca, trova.",a:["chi"],why:"Chi = quien (genérico)."},
    {t:"mc",q:"Il film ___ ti ho parlato è uscito.",o:["che","di cui","a cui","cui di"],a:1,why:"Parlare di → di cui."},
    {t:"mc",q:"È arrivato tardi, ___ mi ha fatto arrabbiare.",o:["che","il che","quello","cui"],a:1,why:"Retoma toda la frase: il che."},
    {t:"fill",q:"Ecco le amiche delle ___ ti ho parlato.",hint:"quale",a:["quali"],why:"Le amiche (femenino plural): delle quali."},
    {t:"order",q:"Ordena la frase: Esta es la razón por la que te he llamado.",a:"Questa è la ragione per cui ti ho chiamato"},
    {t:"tr",q:"Traduce: Haz lo que quieras.",a:["fai quello che vuoi","fai ciò che vuoi","fa' quello che vuoi","fai come vuoi"],why:"Lo que = quello che."}

{
  id:"cong-imperfetto", lvl:"B2", title:"Il congiuntivo imperfetto", titleEs:"El imperfecto de subjuntivo", sub:"Pensavo che fosse, vorrei che tu venissi",
  grammar:`
    <h3>-ssi, -ssi, -sse…</h3>
    <p>Se toma la raíz del imperfetto de indicativo y se añade <b>-ssi, -ssi, -sse, -ssimo, -ste, -ssero</b>.</p>

      <tr><th></th><th>parlare</th><th>prendere</th><th>dormire</th><th>essere</th></tr>
      <tr><td class="p">che io</td><td>parla<em>ssi</em></td><td>prende<em>ssi</em></td><td>dormi<em>ssi</em></td><td><em>fossi</em></td></tr>
      <tr><td class="p">che tu</td><td>parla<em>ssi</em></td><td>prende<em>ssi</em></td><td>dormi<em>ssi</em></td><td><em>fossi</em></td></tr>
      <tr><td class="p">che lui / lei</td><td>parla<em>sse</em></td><td>prende<em>sse</em></td><td>dormi<em>sse</em></td><td><em>fosse</em></td></tr>
      <tr><td class="p">che noi</td><td>parla<em>ssimo</em></td><td>prende<em>ssimo</em></td><td>dormi<em>ssimo</em></td><td><em>fossimo</em></td></tr>
      <tr><td class="p">che voi</td><td>parla<em>ste</em></td><td>prende<em>ste</em></td><td>dormi<em>ste</em></td><td><em>foste</em></td></tr>
      <tr><td class="p">che loro</td><td>parla<em>ssero</em></td><td>prende<em>ssero</em></td><td>dormi<em>ssero</em></td><td><em>fossero</em></td></tr>
    </table></div>
    <p>Irregulares de verdad solo tres: <i>essere → fossi, dare → dessi, stare → stessi</i>. Fare, dire y bere salen de su imperfetto: <i>facessi, dicessi, bevessi</i>.</p>
    <h4>Cuándo</h4>
    <p><b>Con la principal en pasado</b>: <i>Pensavo che fosse chiuso. Volevo che tu venissi.</i></p>
    <p><b>Con condicional de deseo</b>: <i>Vorrei che tu restassi.</i></p>
    <p><b>Con come se y magari</b>: <i>Parla come se sapesse tutto. Magari fosse vero!</i></p>
    <div class="trap"><b>Trampa para hispanohablantes:</b> el español tiene dos formas (-ra y -se); el italiano solo una, en <i>-ssi</i>. Y después de <i>se</i> nunca va condicional: «si tuviera» = <i>se avessi</i>, jamás «se avrei».</div>`,

{
  id:"concordanza", lvl:"B2", title:"Congiuntivo passato e trapassato", titleEs:"Subjuntivo perfecto y pluscuamperfecto", sub:"Penso che sia partito, pensavo che fosse partito",
  grammar:`
    <h3>Los compuestos del congiuntivo</h3>
    <p><b>Passato</b>: congiuntivo presente de avere/essere + participio: <i>abbia mangiato, sia andata</i>.</p>
    <p><b>Trapassato</b>: congiuntivo imperfetto de avere/essere + participio: <i>avessi mangiato, fossi andata</i>.</p>
    <h4>La concordancia de tiempos</h4>
    <p>El tiempo de la subordinada depende de la principal y de si la acción es simultánea, anterior o posterior:</p>
    <div class="tbl"><table>
      <tr><th>Principal</th><th>Simultánea</th><th>Anterior</th><th>Posterior</th></tr>
      <tr><td>Penso che…</td><td><em>parta</em></td><td><em>sia partito</em></td><td><em>partirà</em></td></tr>
      <tr><td>Pensavo che…</td><td><em>partisse</em></td><td><em>fosse partito</em></td><td><em>sarebbe partito</em></td></tr>
    </table></div>
    <div class="ex">Mi dispiace che tu non sia venuta.<span>Siento que no hayas venido.</span></div>
    <div class="ex">Temevo che fosse successo qualcosa.<span>Temía que hubiera pasado algo.</span></div>
    <div class="trap"><b>Trampa para hispanohablantes:</b> la posterioridad en el pasado no es subjuntivo sino <i>condizionale passato</i>: «pensaba que se iría» = <i>pensavo che sarebbe partito</i>.</div>`,
  vocab:[
    ["mi sembra che","me parece que","Mi sembra che abbia già pagato.","Me parece que ya ha pagado."],
    ["è probabile che","es probable que","È probabile che sia uscita.","Es probable que haya salido."],
    ["non credo che","no creo que","Non credo che l'abbia fatto apposta.","No creo que lo haya hecho a propósito."],
    ["mi dispiace che","siento que","Mi dispiace che tu non sia venuto.","Siento que no hayas venido."],
    ["dubito che","dudo que","Dubito che abbiano capito.","Dudo que lo hayan entendido."],
    ["immaginavo che","me imaginaba que","Immaginavo che fossi stanca.","Me imaginaba que estabas cansada."],
    ["pensavo che","pensaba que","Pensavo che vi foste trasferiti.","Pensaba que os habíais mudado."],
    ["sembrava che","parecía que","Sembrava che non avesse dormito.","Parecía que no había dormido."],
    ["è strano che","es raro que","È strano che non abbia chiamato.","Es raro que no haya llamado."],
    ["benché","aunque","Benché avesse studiato, non ha passato l'esame.","Aunque había estudiado, no aprobó el examen."],
    ["temevo che","temía que","Temevo che fosse successo qualcosa.","Temía que hubiera pasado algo."],
    ["sono contenta che","me alegro de que","Sono contenta che tu sia venuta.","Me alegro de que hayas venido."]
  ],

{
  id:"periodo-ipotetico", lvl:"B2", title:"Il periodo ipotetico", titleEs:"Las oraciones condicionales", sub:"Se piove, se piovesse, se fosse piovuto",
  grammar:`
    <h3>Tres tipos de «si»</h3>
    <div class="tbl"><table>
      <tr><th>Tipo</th><th>Se…</th><th>Resultado</th><th>Ejemplo</th></tr>

      <tr><td>Irreal (pasado)</td><td><em>congiuntivo trapassato</em></td><td><em>condizionale passato</em></td><td>Se l'avessi saputo, sarei venuta.</td></tr>
    </table></div>
    <h4>Mixtos</h4>

    <div class="trap"><b>Trampa para hispanohablantes:</b> nunca condicional después de <i>se</i>: «se avrei» es un error grave. Y «de haberlo sabido» se dice <i>se l'avessi saputo</i>.</div>`,

{
  id:"passivo", lvl:"B2", title:"La forma passiva", titleEs:"La voz pasiva", sub:"essere, venire e andare + participio",
  grammar:`
    <h3>Tres auxiliares para la pasiva</h3>
    <p><b>Essere + participio</b>, en todos los tiempos: <i>La casa è stata venduta.</i></p>
    <p><b>Venire + participio</b>, solo en tiempos simples; da idea de proceso: <i>La lettera viene spedita domani.</i></p>
    <p><b>Andare + participio</b> = <span class="mark">hay que, debe</span>: <i>Il biglietto va convalidato.</i> Con perdere, smarrire o distruggere indica pérdida: <i>I documenti sono andati persi.</i></p>
    <p>El agente se introduce con <b>da</b>: <i>Il quadro è stato dipinto da Leonardo.</i></p>
    <div class="tbl"><table>
      <tr><th>Activa</th><th>Pasiva</th></tr>
      <tr><td>Spediscono il pacco.</td><td>Il pacco <em>viene / è</em> spedito.</td></tr>
      <tr><td>Hanno annullato il volo.</td><td>Il volo <em>è stato</em> annullato.</td></tr>
      <tr><td>Bisogna firmare il contratto.</td><td>Il contratto <em>va</em> firmato.</td></tr>
    </table></div>
    <div class="trap"><b>Trampa para hispanohablantes:</b> «andare + participio» no existe con este sentido en español. <i>Il modulo va compilato</i> no es «el formulario va rellenado», sino «hay que rellenar el formulario».</div>`,
  vocab:[
    ["essere costruito","ser construido","Il Colosseo è stato costruito nel I secolo.","El Coliseo fue construido en el siglo I."],
    ["venire spedito","ser enviado","Il pacco viene spedito oggi.","El paquete se envía hoy."],
    ["va fatto","hay que hacerlo","Il modulo va compilato a mano.","El formulario hay que rellenarlo a mano."],
    ["andare perso","perderse","La valigia è andata persa.","La maleta se ha perdido."],
    ["essere vietato","estar prohibido","È vietato entrare.","Está prohibido entrar."],
    ["dipingere","pintar (cuadros)","È stato dipinto da Raffaello.","Fue pintado por Rafael."],
    ["approvare","aprobar","Il progetto è stato approvato.","El proyecto ha sido aprobado."],
    ["rimborsare","reembolsar","Il biglietto verrà rimborsato.","El billete será reembolsado."],
    ["annullare","cancelar, anular","Il volo è stato annullato.","El vuelo ha sido cancelado."],
    ["rinviare","aplazar","La riunione è stata rinviata.","La reunión ha sido aplazada."],
    ["firmare","firmar","Il contratto va firmato entro venerdì.","El contrato hay que firmarlo antes del viernes."],
    ["consegnare","entregar","La merce viene consegnata in 48 ore.","La mercancía se entrega en 48 horas."]
  ],
  ex:[
    {t:"mc",q:"Il volo ___ annullato per sciopero.",o:["ha stato","è stato","viene stato","va stato"],a:1,why:"Pasiva en pasado: è stato annullato."},

{
  id:"discorso-indiretto", lvl:"B2", title:"Il discorso indiretto", titleEs:"El estilo indirecto", sub:"Ha detto che sarebbe venuto",
  grammar:`
    <h3>Contar lo que dijo otro</h3>
    <p>Si el verbo introductor está en pasado (<i>ha detto, disse</i>), los tiempos retroceden:</p>
    <div class="tbl"><table>
      <tr><th>Directo</th><th>Indirecto</th></tr>
      <tr><td>presente: «Sono stanca»</td><td>imperfetto: che <em>era</em> stanca</td></tr>
      <tr><td>passato prossimo: «Ho perso il treno»</td><td>trapassato: che <em>aveva perso</em> il treno</td></tr>
      <tr><td>futuro: «Verrò»</td><td>condizionale passato: che <em>sarebbe venuto</em></td></tr>
      <tr><td>imperativo: «Aspetta!»</td><td>di + infinito: di <em>aspettare</em></td></tr>
      <tr><td>congiuntivo presente</td><td>congiuntivo imperfetto</td></tr>
    </table></div>
    <h4>Cambian también tiempo y lugar</h4>
    <p><i>oggi → quel giorno, domani → il giorno dopo, ieri → il giorno prima, qui → lì, questo → quello</i>.</p>
    <h4>Preguntas</h4>
    <p>Con <b>se</b> o con la palabra interrogativa: <i>Mi ha chiesto se volevo un caffè. Mi ha chiesto dove abitavo.</i></p>
    <div class="trap"><b>Trampa para hispanohablantes:</b> «dijo que vendría» no es «ha detto che verrebbe», sino <i>ha detto che sarebbe venuto</i> (condicional compuesto).</div>`,
  vocab:[
    ["dire che","decir que","Ha detto che era stanca.","Dijo que estaba cansada."],
    ["chiedere se","preguntar si","Mi ha chiesto se volevo venire.","Me preguntó si quería ir."],

    ["spiegare che","explicar que","Ha spiegato che il treno era in ritardo.","Explicó que el tren llevaba retraso."],
    ["il giorno dopo","al día siguiente","Ha detto che sarebbe partito il giorno dopo.","Dijo que se iría al día siguiente."],
    ["il giorno prima","el día anterior","Ha detto che l'aveva visto il giorno prima.","Dijo que lo había visto el día anterior."],
    ["quel giorno","aquel día","Ha detto che quel giorno non poteva.","Dijo que aquel día no podía."],
    ["lì","allí","Ha detto che lì si stava bene.","Dijo que allí se estaba bien."],
    ["ordinare di","ordenar","Mi ha ordinato di aspettare.","Me ordenó esperar."],
    ["pregare di","rogar","Ci ha pregato di fare silenzio.","Nos rogó que guardáramos silencio."],
    ["assicurare che","asegurar que","Mi ha assicurato che avrebbe pagato.","Me aseguró que pagaría."],
    ["ammettere che","admitir que","Ha ammesso che aveva sbagliato.","Admitió que se había equivocado."]
  ],
  ex:[
    {t:"mc",q:"«Sono stanca» → Ha detto che ___ stanca.",o:["è","era","fosse","sarà"],a:1,why:"Presente → imperfetto."},

    {t:"fill",q:"«Pagherò io» → Mi ha assicurato che ___ pagato lui.",a:["avrebbe"],why:"Futuro → avrebbe pagato."},

{
  id:"connettivi", lvl:"B2", title:"Connettivi e congiunzioni", titleEs:"Conectores y conjunciones", sub:"però, tuttavia, quindi, affinché, nonostante",
  grammar:`
    <h3>Las palabras que dan estructura</h3>
    <div class="tbl"><table>
      <tr><th>Función</th><th>Conectores</th><th>Modo</th></tr>
      <tr><td>Oposición</td><td>ma, <em>però</em>, <em>tuttavia</em>, <em>eppure</em>, <em>invece</em></td><td>indicativo</td></tr>
      <tr><td>Causa</td><td>perché, poiché, <em>siccome</em> (al inicio), <em>dato che</em>, <em>visto che</em></td><td>indicativo</td></tr>
      <tr><td>Consecuencia</td><td><em>quindi</em>, dunque, <em>perciò</em>, così</td><td>indicativo</td></tr>
      <tr><td>Concesión</td><td><em>benché</em>, <em>sebbene</em>, <em>nonostante</em>, malgrado</td><td>congiuntivo</td></tr>
      <tr><td>Concesión</td><td><em>anche se</em></td><td>indicativo</td></tr>
      <tr><td>Finalidad</td><td><em>affinché</em>, perché (= para que)</td><td>congiuntivo</td></tr>
      <tr><td>Tiempo</td><td>appena, mentre, <em>finché (non)</em>, dopo che</td><td>indicativo</td></tr>
    </table></div>
    <p><b>Perché</b> tiene dos caras: con indicativo es «porque»; con congiuntivo, «para que»: <i>Te lo dico perché tu lo sappia.</i></p>
    <div class="trap"><b>Trampa para hispanohablantes:</b> <i>anche se</i> va con indicativo («anche se è tardi»), aunque en español a veces usemos subjuntivo. Y <i>invece</i> es «en cambio», no solo «en vez de».</div>`,

{
  id:"passato-remoto", lvl:"C1", title:"Il passato remoto", titleEs:"El pretérito indefinido literario", sub:"parlò, nacque, fu: el tiempo de la narración",
  grammar:`
    <h3>El pasado de los libros</h3>
    <p>Se usa en literatura, en textos de historia y en el habla del sur de Italia. En el norte, en la conversación, se prefiere el passato prossimo.</p>
    <div class="tbl"><table>
      <tr><th></th><th>parlare</th><th>credere</th><th>dormire</th></tr>
      <tr><td class="p">io</td><td>parl<em>ai</em></td><td>cred<em>ei / etti</em></td><td>dorm<em>ii</em></td></tr>
      <tr><td class="p">tu</td><td>parl<em>asti</em></td><td>cred<em>esti</em></td><td>dorm<em>isti</em></td></tr>
      <tr><td class="p">lui / lei</td><td>parl<em>ò</em></td><td>cred<em>é / ette</em></td><td>dorm<em>ì</em></td></tr>
      <tr><td class="p">noi</td><td>parl<em>ammo</em></td><td>cred<em>emmo</em></td><td>dorm<em>immo</em></td></tr>
      <tr><td class="p">voi</td><td>parl<em>aste</em></td><td>cred<em>este</em></td><td>dorm<em>iste</em></td></tr>
      <tr><td class="p">loro</td><td>parl<em>arono</em></td><td>cred<em>erono / ettero</em></td><td>dorm<em>irono</em></td></tr>
    </table></div>
    <h4>Irregulares: la regla 1-3-6</h4>
    <p>La mayoría solo es irregular en <span class="mark">io, lui/lei y loro</span>; el resto se forma desde el infinitivo. Ejemplo, <b>scrivere</b>: scrissi, scrivesti, scrisse, scrivemmo, scriveste, scrissero.</p>
    <div class="tbl"><table>
      <tr><th>Verbo</th><th>io / lui / loro</th><th>Verbo</th><th>io / lui / loro</th></tr>
      <tr><td>essere</td><td><em>fui, fu, furono</em> (todo irregular)</td><td>avere</td><td><em>ebbi, ebbe, ebbero</em></td></tr>
      <tr><td>fare</td><td><em>feci, fece, fecero</em></td><td>dire</td><td><em>dissi, disse, dissero</em></td></tr>
      <tr><td>venire</td><td><em>venni, venne, vennero</em></td><td>vedere</td><td><em>vidi, vide, videro</em></td></tr>
      <tr><td>nascere</td><td><em>nacqui, nacque, nacquero</em></td><td>vivere</td><td><em>vissi, visse, vissero</em></td></tr>
      <tr><td>prendere</td><td><em>presi, prese, presero</em></td><td>conoscere</td><td><em>conobbi, conobbe, conobbero</em></td></tr>
      <tr><td>volere</td><td><em>volli, volle, vollero</em></td><td>sapere</td><td><em>seppi, seppe, seppero</em></td></tr>
    </table></div>
    <div class="trap"><b>Trampa para hispanohablantes:</b> en español «fui» es de ser y de ir. En italiano <i>fui</i> es solo de essere; «fui a Roma» es <i>andai a Roma</i>.</div>`,

{
  id:"futuro-anteriore", lvl:"C1", title:"Futuro anteriore e condizionale passato", titleEs:"Futuro compuesto y condicional compuesto", sub:"Avrà già finito, avrei voluto, sarebbe arrivato",
  grammar:`
    <h3>Futuro anteriore: avrò / sarò + participio</h3>
    <p><b>Acción futura anterior a otra futura</b>: <i>Quando avrò finito, ti chiamerò.</i></p>
    <p><b>Suposición sobre el pasado</b>: <i>Non risponde: avrà dimenticato il telefono.</i> (Se habrá olvidado el teléfono.)</p>
    <h4>Condizionale passato: avrei / sarei + participio</h4>
    <p><b>Deseo que no se cumplió</b>: <i>Avrei voluto venire.</i></p>
    <p><b>Reproche o consejo tardío</b>: <i>Avresti dovuto chiamarmi.</i></p>
    <p><b>Futuro en el pasado</b>: <i>Ha detto che sarebbe venuto.</i></p>
    <p><b>Noticia no confirmada</b>: <i>Secondo indiscrezioni, l'attore si sarebbe sposato.</i></p>

      <tr><td>habría querido</td><td><em>avrei voluto</em></td></tr>
      <tr><td>dijo que vendría</td><td>ha detto che <em>sarebbe venuto</em></td></tr>
    </table></div>
    <div class="trap"><b>Trampa para hispanohablantes:</b> tras <i>quando, appena, dopo che</i> con valor futuro, el español usa subjuntivo («cuando hayas terminado»); el italiano, futuro anteriore: <i>quando avrai finito</i>.</div>`,

{
  id:"forme-implicite", lvl:"C1", title:"Le forme implicite", titleEs:"Las formas no personales", sub:"Dopo aver mangiato, finito il lavoro, avendo capito",
  grammar:`
    <h3>Frases más compactas</h3>
    <p>Cuando el sujeto es el mismo, el italiano culto prefiere formas sin verbo conjugado.</p>
    <h4>Infinito passato</h4>
    <p><b>Dopo aver(e) / essere + participio</b>: <i>Dopo aver cenato, siamo usciti. Dopo essere arrivata, mi ha chiamato.</i> Con essere, el participio concuerda.</p>
    <p>También <i>prima di + infinito</i> y <i>senza + infinito</i>: <i>È uscito senza salutare.</i></p>
    <h4>Participio assoluto</h4>
    <p>El participio solo, al principio de la frase, equivale a «una vez que»: <i>Finito il lavoro, siamo andati al bar. Arrivate a Roma, le ragazze hanno cercato l'albergo.</i></p>
    <h4>Gerundio composto</h4>
    <p><b>Avendo / essendo + participio</b> expresa una causa anterior: <i>Avendo perso il treno, ho preso un taxi.</i></p>
    <p>Los pronombres se pegan: <i>dopo averlo visto, avendolo saputo</i>.</p>
    <div class="trap"><b>Trampa para hispanohablantes:</b> «después de comer» no es «dopo mangiare», sino <i>dopo aver mangiato</i>. Y «al salir» se dice <i>uscendo</i> o, en registro formal, <i>nell'uscire</i>.</div>`,
  vocab:[

{
  id:"pronominali", lvl:"C1", title:"I verbi pronominali", titleEs:"Los verbos pronominales", sub:"farcela, andarsene, prendersela, cavarsela",
  grammar:`
    <h3>Verbos con pronombres fijos</h3>
    <p>Muchos verbos cambian de significado al añadir <i>ci, ne, la</i> o combinaciones. Son muy frecuentes en la lengua hablada.</p>
    <div class="tbl"><table>
      <tr><th>Verbo</th><th>Significado</th><th>Ejemplo</th></tr>
      <tr><td><em>farcela</em></td><td>lograrlo, poder con algo</td><td>Ce la faccio. Ce l'ho fatta!</td></tr>
      <tr><td><em>andarsene</em></td><td>irse</td><td>Me ne vado. Se n'è andata.</td></tr>
      <tr><td><em>prendersela</em></td><td>enfadarse, ofenderse</td><td>Non prendertela!</td></tr>
      <tr><td><em>cavarsela</em></td><td>apañárselas, defenderse</td><td>Me la cavo.</td></tr>
      <tr><td><em>avercela con</em></td><td>estar enfadado con</td><td>Ce l'hai con me?</td></tr>
      <tr><td><em>sentirsela</em></td><td>verse con ánimos</td><td>Non me la sento.</td></tr>
      <tr><td><em>smetterla</em></td><td>dejarlo ya</td><td>Smettila!</td></tr>
      <tr><td><em>fregarsene</em></td><td>pasar de algo (coloquial)</td><td>Me ne frego.</td></tr>
    </table></div>
    <h4>Cómo se conjugan</h4>
    <p>El primer pronombre cambia con la persona (me, te, se, ce, ve, se) y el segundo queda fijo: <i>me la cavo, te la cavi, se la cava…</i></p>
    <p>En tiempos compuestos, los que llevan <i>-sene</i> o <i>-sela</i> van con essere: <i>se n'è andata, me la sono presa</i>. <b>Farcela</b> va con avere: <i>ce l'ho fatta</i>.</p>
    <div class="trap"><b>Trampa para hispanohablantes:</b> <i>Ce l'ho fatta!</i> no es «lo he hecho», sino «¡lo he conseguido!».</div>`,
  vocab:[
    ["farcela","lograrlo, poder","Ce l'ho fatta!","¡Lo he conseguido!"],
    ["andarsene","irse","Se n'è andato senza salutare.","Se fue sin despedirse."],

    ["cavarsela","apañárselas","Con l'italiano me la cavo.","Con el italiano me defiendo."],

    ["sentirsela","verse con ánimos","Non me la sento di guidare di notte.","No me veo con ánimos de conducir de noche."],
    ["smetterla","dejarlo, parar","Smettila di lamentarti!","¡Deja de quejarte!"],
    ["godersela","disfrutarlo","Goditela, te la meriti!","¡Disfrútala, te la mereces!"],
    ["fregarsene","pasar de algo (coloquial)","Me ne frego di quello che dice.","Paso de lo que dice."],
    ["intendersene","entender de algo","Te ne intendi di vini?","¿Entiendes de vinos?"],
    ["volerci","hacer falta","Ci vuole coraggio.","Hace falta valor."],
    ["metterci","tardar","Ci ho messo un'ora.","He tardado una hora."]
  ],
  ex:[
