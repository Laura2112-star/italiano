{
  id:"alterati", lvl:"C1", title:"Alterati e formazione delle parole", titleEs:"Diminutivos, aumentativos y formación de palabras", sub:"-ino, -etto, -one, -accio y los prefijos s-, ri-, stra-",
  grammar:`
    <h3>Sufijos que cambian el matiz</h3>
    <div class="tbl"><table>
      <tr><th>Tipo</th><th>Sufijos</th><th>Ejemplos</th></tr>
      <tr><td>Diminutivo</td><td><em>-ino, -etto, -ello</em></td><td>tavolino, casetta, alberello</td></tr>
      <tr><td>Aumentativo</td><td><em>-one</em></td><td>portone, librone, donnona</td></tr>
      <tr><td>Peyorativo</td><td><em>-accio</em></td><td>tempaccio, parolaccia</td></tr>
      <tr><td>Afectivo</td><td><em>-uccio, -otto</em></td><td>tesoruccio, ragazzotto</td></tr>
    </table></div>
    <p>Con <b>-one</b> muchos femeninos pasan a masculino: <i>la porta → il portone, la palla → il pallone</i>.</p>
    <p><b>Falsos alterados</b>: <i>mulino</i> (molino), <i>bottone</i> (botón), <i>lampone</i> (frambuesa), <i>rubinetto</i> (grifo) son palabras propias.</p>
    <h4>Prefijos útiles</h4>
    <p><b>s-</b> invierte o quita: <i>scontento, scaricare, sconsigliare</i>. <b>ri-</b> repite: <i>rifare, rileggere</i>. <b>stra-</b> intensifica: <i>stracotto, strapieno</i>. <b>in-/im-, dis-</b> niegan: <i>impossibile, disonesto</i>.</p>
    <h4>Sufijos de derivación</h4>
    <p><i>-mente</i> (adverbios), <i>-zione</i> (acción: prenotazione), <i>-tore/-trice</i> (agente: traduttrice), <i>-bile</i> (posibilidad: lavabile).</p>
    <div class="trap"><b>Trampa para hispanohablantes:</b> el diminutivo español en <i>-ito</i> no existe: «casita» es <i>casetta</i> o <i>casina</i>, «un momentito» es <i>un attimino</i>.</div>`,
  vocab:[

    ["scontento","descontento","È scontento del risultato.","Está descontento con el resultado."],
    ["rifare","rehacer, volver a hacer","Devo rifare tutto.","Tengo que rehacerlo todo."],

  id:"congiuntivo-avanzato", lvl:"C2", title:"Usi avanzati del congiuntivo", titleEs:"Usos avanzados del subjuntivo", sub:"Che sia chiaro, chiunque sia, qualunque cosa accada",
  grammar:`
    <h3>El congiuntivo sin verbo principal</h3>
    <p>Puede ir solo para expresar deseo, orden o resignación: <i>Che sia chiaro! Che entrino pure. Che Dio ce la mandi buona.</i></p>
    <h4>Con indefinidos</h4>
    <p><em>chiunque, qualunque, qualsiasi, comunque, dovunque</em> + congiuntivo: <i>Chiunque tu sia… Qualunque cosa succeda… Comunque vada… Dovunque tu vada…</i></p>
    <h4>Tras superlativo, «unico» y negación</h4>
    <p><i>È il libro più bello che abbia mai letto. È l'unica persona che mi capisca. Non c'è nessuno che lo sappia.</i></p>
    <h4>Con antecedente buscado o desconocido</h4>
    <p><i>Cerco qualcuno che parli tedesco.</i> Si la persona existe y la conoces: <i>Conosco qualcuno che parla tedesco.</i></p>
    <h4>Otros contextos cultos</h4>
    <p><i>Il fatto che</i> + congiuntivo; preguntas indirectas formales: <i>Non so se sia vero. Mi chiedo chi sia.</i> Y fórmulas: <i>che io sappia, ammesso che, posto che</i>.</p>
    <div class="trap"><b>Trampa para hispanohablantes:</b> «el más bonito que he visto» en español va en indicativo; en italiano se dice <i>il più bello che abbia mai visto</i>.</div>`,
  vocab:[
    ["che sia chiaro","que quede claro","Che sia chiaro: non lo rifaccio.","Que quede claro: no lo vuelvo a hacer."],
    ["chiunque","quienquiera que","Chiunque chiami, non ci sono.","Llame quien llame, no estoy."],
    ["qualunque cosa","cualquier cosa (que)","Qualunque cosa succeda, chiamami.","Pase lo que pase, llámame."],
    ["comunque vada","pase lo que pase","Comunque vada, sarà un successo.","Pase lo que pase, será un éxito."],
    ["dovunque","dondequiera que","Dovunque tu vada, ti seguirò.","Vayas donde vayas, te seguiré."],
    ["il più… che abbia mai","el más… que haya","È il posto più bello che abbia mai visto.","Es el sitio más bonito que he visto nunca."],
    ["non c'è nessuno che","no hay nadie que","Non c'è nessuno che lo sappia.","No hay nadie que lo sepa."],
    ["cerco qualcuno che","busco a alguien que","Cerco qualcuno che parli tedesco.","Busco a alguien que hable alemán."],
    ["il fatto che","el hecho de que","Il fatto che tu sia qui mi rende felice.","Que estés aquí me hace feliz."],
    ["non so se","no sé si","Non so se sia la scelta giusta.","No sé si es la decisión correcta."],

{
  id:"ordine-marcato", lvl:"C2", title:"L'ordine marcato", titleEs:"El orden marcado de la frase", sub:"Il caffè, lo prendo amaro · È lui che ha chiamato",
  grammar:`
    <h3>Mover las piezas para dar énfasis</h3>
    <h4>Dislocación a la izquierda</h4>
    <p>El tema va delante y se retoma con un pronombre, que es obligatorio: <i>La pasta, la compro io. A Roma, ci vado domani. Di vino, ne bevo poco.</i></p>
    <h4>Dislocación a la derecha</h4>
    <p>El tema va al final, como aclaración: <i>L'hai visto, il film? Ce l'hai, la chiave?</i></p>
    <h4>Frase escindida</h4>
    <p><b>È + elemento + che</b>: <i>È Marco che ha chiamato. È per questo che sono venuta.</i></p>
    <p>Con sujeto, también <b>essere + a + infinito</b>: <i>Sono stati loro a dirmelo.</i></p>
    <h4>Partículas del habla culta y coloquial</h4>
    <p><i>quanto a, per quanto riguarda</i> (en cuanto a), <i>insomma</i> (en resumen), <i>cioè</i> (es decir), <i>mica</i> (negación enfática), <i>proprio</i> (justo, realmente).</p>
    <div class="trap"><b>Trampa para hispanohablantes:</b> «es él quien ha llamado» no es «è lui chi ha chiamato», sino <i>è lui che ha chiamato</i>. Y en la dislocación con cantidad hace falta <i>ne</i>.</div>`,
  vocab:[
    ["quanto a","en cuanto a","Quanto a me, sono d'accordo.","En cuanto a mí, estoy de acuerdo."],
    ["per quanto riguarda","por lo que respecta a","Per quanto riguarda il prezzo, ne parliamo.","En cuanto al precio, lo hablamos."],
    ["è lui che","es él quien","È lui che ha chiamato.","Es él quien ha llamado."],
    ["è per questo che","es por eso por lo que","È per questo che sono venuta.","Es por eso por lo que he venido."],
    ["sono stati loro a","fueron ellos quienes","Sono stati loro a dirmelo.","Fueron ellos quienes me lo dijeron."],
    ["c'è chi","hay quien","C'è chi preferisce il mare.","Hay quien prefiere el mar."],
    ["c'è uno che","hay uno que","C'è uno che ti cerca.","Hay uno que te busca."],
    ["il fatto è che","el caso es que","Il fatto è che non ho tempo.","El caso es que no tengo tiempo."],
    ["insomma","en resumen, en fin","Insomma, com'è andata?","En fin, ¿cómo ha ido?"],
    ["cioè","es decir","Arrivo domani, cioè sabato.","Llego mañana, es decir, el sábado."],
    ["mica","(negación enfática)","Non sono mica scemo!","¡Que no soy tonto!"],
    ["proprio","justamente, realmente","È proprio quello che cercavo.","Es justo lo que buscaba."]
  ],
  ex:[
    {t:"fill",q:"Il caffè, ___ prendo senza zucchero.",a:["lo"],why:"Dislocación: el pronombre retoma il caffè."},
    {t:"fill",q:"Di vino, ___ bevo poco.",a:["ne"],why:"Cantidad: ne."},

{
  id:"registro", lvl:"C2", title:"Registri e linguaggio formale", titleEs:"Registros y lenguaje formal", sub:"Lei, la lettera formale, il burocratese e il parlato",
  grammar:`
    <h3>Elegir el tono</h3>
    <h4>El Lei</h4>
    <p>Se escribe a menudo con mayúscula en cartas: <i>La ringrazio, Le scrivo, la Sua email</i>. Los adjetivos concuerdan con la persona real: <i>Signor Rossi, Lei è stato gentile.</i></p>
    <h4>La carta o el email formal</h4>
    <div class="tbl"><table>
      <tr><th>Parte</th><th>Fórmulas</th></tr>
      <tr><td>Saludo</td><td><em>Gentile</em> Dottoressa Bianchi, / <em>Egregio</em> Signor Rossi,</td></tr>
      <tr><td>Inicio</td><td><em>In riferimento a</em>… / <em>Con la presente</em>…</td></tr>
      <tr><td>Adjuntos</td><td><em>In allegato</em> trova…</td></tr>
      <tr><td>Cierre</td><td><em>Resto in attesa di un Suo cortese riscontro.</em></td></tr>
      <tr><td>Despedida</td><td><em>Cordiali saluti</em> / <em>Distinti saluti</em></td></tr>
    </table></div>
    <h4>Burocratese</h4>
    <p>El italiano administrativo prefiere sustantivos y verbos «cultos»:</p>
    <div class="tbl"><table>
      <tr><th>Neutro</th><th>Formal</th></tr>
      <tr><td>pagare</td><td>effettuare il pagamento</td></tr>
      <tr><td>chiedere</td><td>richiedere</td></tr>
      <tr><td>mandare</td><td>inviare, trasmettere</td></tr>
      <tr><td>dare</td><td>fornire</td></tr>
      <tr><td>dire</td><td>comunicare</td></tr>
      <tr><td>entro il 15</td><td>entro e non oltre il 15</td></tr>
    </table></div>
    <h4>Y en el otro extremo</h4>
    <p>Coloquial: <i>dai, boh, tipo, figurati, magari, mica</i>.</p>
    <div class="trap"><b>Trampa para hispanohablantes:</b> «Estimado/a» en un email es <i>Gentile</i>, no «Stimato/a». Y <i>Dottore/Dottoressa</i> se usa con cualquier persona licenciada.</div>`,

{
  id:"modi-di-dire", lvl:"C2", title:"Modi di dire e proverbi", titleEs:"Expresiones y refranes", sub:"In bocca al lupo, essere al verde, costare un occhio della testa",
  grammar:`
    <h3>Hablar como un nativo</h3>
    <p>A nivel C2, las expresiones idiomáticas marcan la diferencia. Muchas tienen equivalente en español, pero con otra imagen.</p>
    <div class="tbl"><table>
      <tr><th>Italiano</th><th>Español</th></tr>
      <tr><td><em>In bocca al lupo!</em> (se responde <i>Crepi!</i>)</td><td>¡Mucha suerte!</td></tr>
      <tr><td><em>essere al verde</em></td><td>estar sin blanca</td></tr>
      <tr><td><em>costare un occhio della testa</em></td><td>costar un ojo de la cara</td></tr>
      <tr><td><em>non vedere l'ora di</em></td><td>estar deseando</td></tr>
      <tr><td><em>prendere un granchio</em></td><td>equivocarse, meter la pata</td></tr>
      <tr><td><em>essere in gamba</em></td><td>ser muy capaz</td></tr>
      <tr><td><em>acqua in bocca</em></td><td>ni una palabra</td></tr>
      <tr><td><em>fare la scarpetta</em></td><td>mojar pan en la salsa</td></tr>
      <tr><td><em>avere le mani bucate</em></td><td>ser un manirroto</td></tr>
      <tr><td><em>tirare un pacco</em></td><td>dar plantón</td></tr>
    </table></div>
    <h4>Refranes</h4>
    <p><i>Chi va piano va sano e va lontano.</i> (Vísteme despacio que tengo prisa.)<br><i>Tra il dire e il fare c'è di mezzo il mare.</i> (Del dicho al hecho hay mucho trecho.)<br><i>L'abito non fa il monaco.</i> (El hábito no hace al monje.)<br><i>Non tutte le ciambelle riescono col buco.</i> (No siempre salen las cosas como uno quiere.)</p>
    <div class="trap"><b>Trampa para hispanohablantes:</b> a «In bocca al lupo!» no se responde «grazie» (se considera que trae mala suerte), sino <i>Crepi!</i> o <i>Crepi il lupo!</i>.</div>`,
  vocab:[
    ["In bocca al lupo! / Crepi!","¡Mucha suerte! / ¡Gracias!","Domani hai l'esame? In bocca al lupo!","¿Mañana tienes el examen? ¡Mucha suerte!"],
    ["essere al verde","estar sin blanca","A fine mese sono sempre al verde.","A final de mes siempre estoy sin blanca."],
    ["costare un occhio della testa","costar un ojo de la cara","Quella borsa costa un occhio della testa.","Ese bolso cuesta un ojo de la cara."],
    ["non vedere l'ora","estar deseando","Non vedo l'ora di vederti!","¡Estoy deseando verte!"],
    ["prendere un granchio","equivocarse, meter la pata","Ho preso un granchio con le date.","Me he equivocado con las fechas."],

function conj(v, t){
  const inf=v.inf, type=inf.slice(-3), s=inf.slice(0,-3);
  const hard = type==="are" && /[cg]$/.test(s), iStem = type==="are" && /i$/.test(s);
  if (t==="pres"){
    if (v.pres) return v.pres;
    if (type==="are"){ const h=hard?s+"h":s; return [s+"o", iStem?s:h+"i", s+"a", iStem?s+"amo":h+"iamo", s+"ate", s+"ano"]; }
    if (type==="ere") return [s+"o",s+"i",s+"e",s+"iamo",s+"ete",s+"ono"];
    if (v.isc) return [s+"isco",s+"isci",s+"isce",s+"iamo",s+"ite",s+"iscono"];
    return [s+"o",s+"i",s+"e",s+"iamo",s+"ite",s+"ono"];
  }
  if (t==="imp"){
    if (v.imp) return v.imp;
    const b = v.impStem || inf.slice(0,-2);
    return ["vo","vi","va","vamo","vate","vano"].map(e => b+e);
  }
  const fstem = () => {
    if (v.fut) return v.fut;
    if (type==="are"){ let st = s; if (hard) st += "h"; else if (/[cg]i$/.test(s)) st = s.slice(0,-1); return st+"er"; }
    return s + (type==="ere" ? "er" : "ir");
  };
  if (t==="fut") return ["ò","ai","à","emo","ete","anno"].map(e => fstem()+e);
  if (t==="cond") return ["ei","esti","ebbe","emmo","este","ebbero"].map(e => fstem()+e);
  if (t==="cong"){
    if (v.cong) return v.cong;
    if (type==="are"){ const h=hard?s+"h":s; const sg = iStem?s:h+"i"; return [sg,sg,sg, iStem?s+"amo":h+"iamo", iStem?s+"ate":h+"iate", iStem?s+"no":h+"ino"]; }
    if (v.isc) return [s+"isca",s+"isca",s+"isca",s+"iamo",s+"iate",s+"iscano"];
    return [s+"a",s+"a",s+"a",s+"iamo",s+"iate",s+"ano"];
  }
  if (t==="congimp"){
    if (CIMP[inf]) return CIMP[inf];
    const b = v.impStem || inf.slice(0,-2);
    return ["ssi","ssi","sse","ssimo","ste","ssero"].map(e => b+e);
  }
  if (t==="rem"){
    if (REM[inf]) return REM[inf];
    if (type==="are") return ["ai","asti","ò","ammo","aste","arono"].map(e => s+e);
    if (type==="ere") return ["ei|etti","esti","é|ette","emmo","este","erono|ettero"].map(e => e.split("|").map(x => s+x).join("|"));
    return ["ii","isti","ì","immo","iste","irono"].map(e => s+e);
  }
  if (t==="pp"){
    const pp = v.pp || s + ({are:"ato",ere:"uto",ire:"ito"}[type]);
    const aux = AUX[v.aux||"avere"];
    if ((v.aux||"avere")==="avere") return aux.map(a => a+" "+pp);
    const r = pp.slice(0,-1);
    return aux.map((a,k) => a+" "+r+(k<3?"o/a":"i/e"));
  }
}
function accepted(form){
  // "sono andato/a" -> ["sono andato","sono andata"]; "diedi|detti" -> both
  return form.split("|").flatMap(f => { const m = f.match(/^(.*?)([oi])\/([ae])$/); return m ? [m[1]+m[2], m[1]+m[3]] : [f]; });
}

/* ---------- state ---------- */
const KEY = "iiv-progress-v1";
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const addDays = (s,n) => { const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const blank = () => ({lessons:{},cards:{},conj:{},xp:0,streak:{count:0,last:null},days:[],updatedAt:0});
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch(e){}

let dbDoc = null, saveTimer = null;
function setSync(t){ document.getElementById("sync").textContent = t; }
function save(){
  S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (!dbDoc) return;
    try { await dbDoc.set(JSON.parse(JSON.stringify(S))); setSync("Progreso sincronizado en tu cuenta"); }
    catch(e){ setSync("Progreso guardado en este navegador (no se pudo sincronizar)"); }
  }, 800);
}
function activity(xp){
  const t = today();
  if (S.streak.last !== t){ S.streak.count = (S.streak.last === addDays(t,-1)) ? S.streak.count+1 : 1; S.streak.last = t; }
  if (!S.days.includes(t)) S.days.push(t);
  if (S.days.length > 120) S.days = S.days.slice(-120);
  S.xp += xp || 0;
  save(); renderHeader();
}
const currentStreak = () => !S.streak.last ? 0 : (S.streak.last===today() || S.streak.last===addDays(today(),-1)) ? S.streak.count : 0;

(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    dbDoc = db.doc("data/users/"+uid+"/progress");
    const snap = await dbDoc.get();
    if (snap.exists){
      const remote = snap.data();
      if ((remote.updatedAt||0) > (S.updatedAt||0)){
        S = Object.assign(blank(), JSON.parse(JSON.stringify(remote)));
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
        route();
      } else if (S.updatedAt) save();
    } else if (S.updatedAt) save();
    setSync("Progreso sincronizado en tu cuenta");
  } catch(e){}
})();

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.toLowerCase().replace(/[’`´]/g,"'").replace(/[.,!?¿¡;:«»"]/g,"").replace(/\s+/g," ").trim();
const deaccent = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"");
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const es = (it, tr) => tr ? `<span data-es="${esc(tr)}">${esc(it)}</span>` : esc(it);
const wrapEs = (html, tr) => tr ? `<span data-es="${esc(tr)}">${html}</span>` : html;
const ACC = ["à","è","é","ì","ò","ù"];
function accentBar(target){
  return `<div class="accents">${ACC.map(c=>`<button type="button" data-c="${c}" data-for="${target}">${c}</button>`).join("")}</div>`;
}
let lastInput = null;
document.addEventListener("focusin", e => { if (e.target.matches && e.target.matches("input.inp, textarea.inp")) lastInput = e.target; });
document.addEventListener("mousedown", e => { if (e.target.closest && e.target.closest(".accents button")) e.preventDefault(); });
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest(".accents button"); if (!b) return;
  const inp = (lastInput && document.body.contains(lastInput) && !lastInput.disabled) ? lastInput : document.getElementById(b.dataset.for);
  if (!inp || inp.disabled) return;
  const p = inp.selectionStart ?? inp.value.length, q = inp.selectionEnd ?? p;
  inp.value = inp.value.slice(0,p) + b.dataset.c + inp.value.slice(q);
  inp.focus(); inp.setSelectionRange(p+1,p+1);
});

/* ---------- routing ---------- */
let tab = "path", lessonView = null;
document.querySelectorAll(".tabs .tab").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));

/* navigation history for the back button */
const NAV = [];
const navSnap = () => ({tab, lv: lessonView ? {...lessonView} : null});
function navTo(change){
  const prev = navSnap(); change();
  if (JSON.stringify(prev) !== JSON.stringify(navSnap())){ NAV.push(prev); if (NAV.length > 40) NAV.shift(); }
}
function goBack(){
  const s = NAV.pop(); if (!s) return;
  tab = s.tab; lessonView = s.lv ? {...s.lv} : null;
  if (tab==="review") R=null;
  route(); window.scrollTo({top:0});
}
document.getElementById("navback").onclick = goBack;
document.addEventListener("keydown", e => { if (e.altKey && e.key==="ArrowLeft" && NAV.length){ e.preventDefault(); goBack(); } });
function go(t){ navTo(() => { tab=t; lessonView=null; }); if (t==="review") R=null; route(); window.scrollTo({top:0}); }
function route(){
  document.getElementById("navback").hidden = !NAV.length;
  document.querySelectorAll(".tabs .tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===tab));
  if (tab==="path") lessonView ? renderLesson() : renderPath();
  else if (tab==="verbs") renderVerbs();
  else if (tab==="review") renderReview();
  else if (tab==="trans") renderTrans();
  else renderStats();
  renderHeader();
}

/* ---------- quiz ---------- */
let Q = null;
function startQuiz(L, items){ Q = {L, items: items.slice(), i:0, correct:0, wrong:[], full: items.length===L.ex.length && items===L.ex}; renderQ(); }
function renderQ(){
  const box = $("#lbody");
  if (Q.i >= Q.items.length) return renderResult();
  const it = Q.items[Q.i]; Q.locked = false;
  const label = {mc:"Elige la opción correcta", fill:"Completa", order:"Ordena las palabras", tr:"Traduce al italiano"}[it.t];
  const promptHtml = esc(it.q).replace("___",'<span class="gap"></span>');
  let inner = "";
  if (it.t==="mc") inner = `<p class="prompt">${wrapEs(promptHtml,it.es||TR[it.q])}</p>${it.hint?`<p class="hint">(${esc(it.hint)})</p>`:""}<div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
  else if (it.t==="fill" || it.t==="tr") inner = `<p class="prompt">${wrapEs(promptHtml,it.es||TR[it.q])}</p>${it.hint?`<p class="hint">(${esc(it.hint)})</p>`:""}<input class="inp" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe en italiano">${accentBar("ans")}`;
  else { Q.words = shuffle(it.a.split(" ").map((w,k)=>({w,k}))); Q.built=[]; inner = `<p class="prompt" style="font-size:18px">${esc(it.q)}</p><div class="built chips" id="built"></div><div class="chips" id="pool"></div>`; }
  box.innerHTML = `<div class="card qcard stack">
      <div class="qbar"><i style="width:${(Q.i/Q.items.length)*100}%"></i></div>
      <span class="eyebrow">${Q.i+1} / ${Q.items.length} · ${label}</span>
      <div>${inner}</div><div id="fb"></div>
      <div class="actions"><button class="btn mag" id="check" ${it.t==="mc"||it.t==="order"?"disabled":""}>Comprobar</button></div>
    </div>`;
  const check = $("#check");
  if (it.t==="mc"){
    let sel=null;
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (Q.locked) return; box.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel=+b.dataset.k; check.disabled=false; });
    check.onclick = () => grade(sel===it.a, it.o[it.a], () => box.querySelectorAll(".opt").forEach(b => { b.disabled=true; const k=+b.dataset.k; if(k===it.a) b.classList.add("right"); else if(k===sel) b.classList.add("wrong"); }));
  } else if (it.t==="fill" || it.t==="tr"){
    const inp = $("#ans"); inp.focus();
    inp.addEventListener("keydown", e => { if (e.key==="Enter"){ e.preventDefault(); check.click(); }});
    check.onclick = () => {
      const v = norm(inp.value); if (!v) return;
      const answers = it.a.map(norm);
      let ok = answers.includes(v), note = "";
      if (!ok && answers.map(deaccent).includes(deaccent(v))){ ok = true; note = "Casi perfecto: revisa los acentos."; }
      inp.disabled = true; inp.classList.add(ok ? (note?"near":"ok") : "ko");
      grade(ok, it.a[0], null, note);
    };
  } else {
    const draw = () => {
      $("#built").innerHTML = Q.built.map((x,n)=>`<button class="chip" data-n="${n}">${esc(x.w)}</button>`).join("");
      $("#pool").innerHTML = Q.words.map(x=>{ const u=Q.built.includes(x); return `<button class="chip${u?" used":""}" data-k="${x.k}" ${u?"disabled":""}>${esc(x.w)}</button>`; }).join("");
      $("#built").querySelectorAll(".chip").forEach(b => b.onclick = () => { if(Q.locked) return; Q.built.splice(+b.dataset.n,1); draw(); });
      $("#pool").querySelectorAll(".chip").forEach(b => b.onclick = () => { if(Q.locked) return; Q.built.push(Q.words.find(x=>x.k===+b.dataset.k)); draw(); });
      check.disabled = Q.built.length !== Q.words.length;
    };
    draw();
    check.onclick = () => grade(norm(Q.built.map(x=>x.w).join(" ")) === norm(it.a), it.a, null);
  }
}
function grade(ok, correctText, paint, note){
  const it = Q.items[Q.i];
  Q.locked = true; if (paint) paint();
  if (ok) Q.correct++; else Q.wrong.push(it);
  $("#fb").innerHTML = ok
    ? `<div class="fb ok"><b>${es("Esatto!","¡Exacto!")}</b> ${note?esc(note)+" ":""}${it.why?esc(it.why):""}</div>`
    : `<div class="fb ko"><b>${es("Non proprio.","No exactamente.")}</b> Respuesta: <i>${esc(correctText)}</i>${it.why?"<br>"+esc(it.why):""}</div>`;
  const c = $("#check"); c.textContent = Q.i+1 < Q.items.length ? "Siguiente →" : "Ver resultado"; c.disabled=false;
  c.onclick = () => { Q.i++; renderQ(); }; c.focus();
}
function renderResult(){
  const pct = Math.round(Q.correct/Q.items.length*100), st = S.lessons[Q.L.id];
  if (Q.full){ st.attempts=(st.attempts||0)+1; st.best=Math.max(st.best??0,pct); st.last=today(); }
  activity(Q.correct*10);
  const msg = pct>=90 ? es("Bravissima!","¡Muy bien!")+" Lección dominada." : pct>=70 ? es("Molto bene.","Muy bien.")+" Repite los fallos para fijarlos." : pct>=50 ? "Vas bien. Repasa la gramática y vuelve a intentarlo." : es("Coraggio!","¡Ánimo!")+" Vuelve a leer la gramática con calma y repite.";
  const i = LESSONS.indexOf(Q.L), nxt = LESSONS[i+1];
  $("#lbody").innerHTML = `<div class="card qcard stack" style="text-align:center;justify-items:center">
      <span class="eyebrow">Resultado</span><div class="score">${pct}%</div>
      <p style="margin:0">${Q.correct} de ${Q.items.length} correctas · +${Q.correct*10} puntos</p>
      <p class="muted" style="margin:0">${msg}</p>
      <div class="actions" style="justify-content:center">
        ${Q.wrong.length?`<button class="btn mag" id="redo-wrong">Repetir los ${Q.wrong.length} fallos</button>`:""}
        <button class="btn ghost" id="redo-all">Repetir todo</button>
        ${nxt?`<button class="btn ghost" id="next-l">Siguiente: ${nxt.title}</button>`:""}
      </div></div>`;
  const wrong = Q.wrong;
  if (wrong.length) $("#redo-wrong").onclick = () => startQuiz(Q.L, shuffle(wrong));
  $("#redo-all").onclick = () => startQuiz(Q.L, Q.L.ex);
  if (nxt) $("#next-l").onclick = () => openLesson(nxt.id);
}

/* ---------- pronunciation ---------- */
const SPK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const canSpeak = () => "speechSynthesis" in window;
const spokenPron = p => p.replace("lui / lei","lui");
const spokenForm = f => accepted(f)[0];
function sayList(list){
  try {
    speechSynthesis.cancel();
    const v = speechSynthesis.getVoices().find(x => /^it/i.test(x.lang));
    list.forEach(t => { const u = new SpeechSynthesisUtterance(t); u.lang="it-IT"; u.rate=.85; if (v) u.voice=v; speechSynthesis.speak(u); });
  } catch(e){}
}
const spkBtn = (text, cls="") => canSpeak() ? `<button type="button" class="spk ${cls}" data-say="${text.replace(/"/g,"&quot;")}" title="Escuchar" aria-label="Escuchar: ${text.replace(/"/g,"&quot;")}">${SPK_SVG}</button>` : "";
function bindSpk(root=document){ root.querySelectorAll("[data-say]").forEach(b => b.onclick = e => { e.preventDefault(); sayList([b.dataset.say]); }); }
function revealSpk(v, tense){
  const f = conj(v, tense), pr = SUBJ(tense) ? PRON.map(p=>"che "+p) : PRON;
  const lines = f.map((x,k) => spokenPron(pr[k])+" "+spokenForm(x));
  lines.forEach((t,k) => { const c = document.getElementById("spk"+k); if (c) c.innerHTML = spkBtn(t); });
  const all = document.getElementById("spkall"); if (all && canSpeak()){ all.hidden = false; all.onclick = () => sayList(lines); }
  bindSpk($("#view"));
}

/* ---------- Spanish translation of each form ---------- */
const ES_TENSE = {pres:"presente de indicativo", pp:"pretérito perfecto compuesto (he hablado)", imp:"pretérito imperfecto de indicativo", fut:"futuro simple", cond:"condicional simple", cong:"presente de subjuntivo, precedido de «que» (que yo hable)", congimp:"pretérito imperfecto de subjuntivo en -ra, precedido de «que» (que yo hablara)", rem:"pretérito indefinido (hablé)"};
let ESC_CACHE = {}; try { ESC_CACHE = JSON.parse(localStorage.getItem("iiv-conj-es")||"{}") || {}; } catch(e){ ESC_CACHE = {}; }
const ESC_PENDING = {};
function paintEs(v, t, list, msg){
  if (C.verb !== v || C.tense !== t) return;
  for (let k=0;k<6;k++){ const el = document.getElementById("tes"+k); if (!el) continue;
    el.classList.toggle("wait", !list); el.textContent = list ? list[k] : (k===0 && msg ? msg : (msg ? "" : "…")); }
}
async function fillEs(v, t){
  const key = v.inf+"|"+t;
  if (ESC_CACHE[key]) return paintEs(v, t, ESC_CACHE[key]);
  paintEs(v, t, null);
  try {
    if (sampleFn === undefined) sampleFn = (window.claude && claude.use) ? await claude.use("sample") : null;
    if (!sampleFn) return paintEs(v, t, null, "La traducción solo se ve con la página abierta en Claude.");
    if (!ESC_PENDING[key]){
      const it = conj(v, t).map(showForm), pr = SUBJ(t) ? PRON.map(p=>"che "+p) : PRON;
      const prompt = `Conjuga en español de España el verbo que traduce al italiano «${v.inf}» (${v.es}), en ${ES_TENSE[t]}, para las seis personas, con el pronombre delante: yo, tú, él/ella, nosotros, vosotros, ellos. Las formas italianas son: ${it.map((x,k)=>pr[k]+" "+x).join("; ")}.
Usa la traducción más habitual del verbo. Para avere usa «tener». Para essere da las dos formas separadas por « / » en cada persona (yo soy / estoy). Si la forma italiana tiene variante de género (andato/a), usa la forma española equivalente sin repetir.
Responde SOLO con un JSON: {"forms":["yo …","tú …","él/ella …","nosotros …","vosotros …","ellos …"]}`;
      ESC_PENDING[key] = sampleFn.json(prompt, {modelTier:"quick", cache:true});
    }
    const r = await ESC_PENDING[key];
    if (!r || !Array.isArray(r.forms) || r.forms.length !== 6) throw {code:"bad"};
    const forms = r.forms.map(x => String(x).trim());
    ESC_CACHE[key] = forms; try { localStorage.setItem("iiv-conj-es", JSON.stringify(ESC_CACHE)); } catch(e){}
    paintEs(v, t, forms);
  } catch(err){
    delete ESC_PENDING[key];
    paintEs(v, t, null, err && err.code==="not_granted" ? "Hace falta permitir que la página consulte a Claude." : "No se pudo cargar la traducción.");
  }
}

/* ---------- conjugator ---------- */
const C = {mode:"practice", tense:"pres", group:"all", verb:null, checked:false, refVerb:"essere"};
function pickVerb(){
  const pool = V.filter(v => C.group==="all" || (C.group==="irr" ? v.irr : !v.irr)).filter(v => v!==C.verb);
  C.verb = pool[Math.floor(Math.random()*pool.length)]; C.checked=false;
}
function renderVerbs(){
  if (!C.verb) pickVerb();
  const tchips = TENSES.map(t => `<button class="tchip" data-t="${t.id}" aria-pressed="${t.id===C.tense}">${es(t.name,t.es)}</button>`).join("");
  let body = "";
  if (C.mode==="practice"){
    const v = C.verb, forms = conj(v, C.tense), tT = TENSES.find(t=>t.id===C.tense), tn = es(tT.name,tT.es);
    const pr = SUBJ(C.tense) ? PRON.map(p=>"che "+p) : PRON;
    body = `<div class="card stack">
      <div class="verbhead"><span class="v">${v.inf}</span>${spkBtn(v.inf)}<span class="muted">${v.es}</span>${v.irr || (C.tense==="rem" && REM[v.inf]) ? '<span class="tag-irr">IRREGULAR</span>':""}<span class="t">${tn}</span></div>
      ${C.tense==="pp"?`<p class="hint" style="margin:0">Escribe auxiliar + participio. Con essere vale masculino o femenino.</p>`:C.tense==="rem"?`<p class="hint" style="margin:0">Donde hay dos formas (credei / credetti) vale cualquiera.</p>`:""}
      <div class="cgrid"><span class="tesh">En español</span>${pr.map((p,k)=>`<label class="pr" for="c${k}">${p}</label><input class="inp" id="c${k}" data-k="${k}" autocomplete="off" autocapitalize="off" spellcheck="false"><span id="spk${k}"></span><span class="tes wait" id="tes${k}" lang="es">…</span><div class="sol" id="sol${k}" hidden></div>`).join("")}</div>
      ${accentBar("c0")}
      <div id="cfb"></div>
      <div class="actions"><button class="btn ghost spkall" id="spkall" hidden style="margin-right:auto">${SPK_SVG} Escuchar las seis</button><button class="btn ghost" id="show">Ver solución</button><button class="btn ghost" id="again" hidden>Repetir este verbo</button><button class="btn ghost" id="skip">Otro verbo</button><button class="btn mag" id="ccheck">Comprobar</button></div>
    </div>`;
  } else {
    const v = V.find(x=>x.inf===C.refVerb);
    body = `<div class="ctl"><div class="f"><label for="refsel">Verbo</label><select id="refsel">${["Regulares","Irregulares"].map((g,gi)=>`<optgroup label="${g}">${V.filter(x=>!!x.irr===!!gi).map(x=>`<option value="${x.inf}" ${x.inf===C.refVerb?"selected":""}>${x.inf} · ${x.es}</option>`).join("")}</optgroup>`).join("")}</select></div></div>
      <div class="ref">${TENSES.map(t => { const f=conj(v,t.id); const pr = SUBJ(t.id)?PRON.map(p=>"che "+p):PRON;
        const lines = f.map((x,k)=>spokenPron(pr[k])+" "+spokenForm(x));
        return `<div class="card"><div class="rh"><h3>${es(t.name,t.es)}</h3>${canSpeak()?`<button type="button" class="spk sm" data-sayall="${t.id}" title="Escuchar el tiempo completo" aria-label="Escuchar ${es(t.name,t.es)} completo">${SPK_SVG}</button>`:""}</div><table>${f.map((x,k)=>`<tr><td class="p">${pr[k]}</td><td>${showForm(x)}</td><td class="s">${spkBtn(lines[k],"sm")}</td></tr>`).join("")}</table></div>`; }).join("")}</div>`;
  }
  $("#view").innerHTML = `
    <div class="sh"><div><span class="eyebrow">${es("Coniugatore","Conjugador")}</span><h1 style="font-size:clamp(32px,4.5vw,46px);margin:6px 0 0">${es("Coniuga i verbi","Conjuga los verbos")}</h1></div>
      <div class="seg" role="group"><button data-m="practice" aria-pressed="${C.mode==="practice"}">Practicar</button><button data-m="ref" aria-pressed="${C.mode==="ref"}">Consultar tablas</button></div></div>
    ${C.mode==="practice"?`<div class="ctl">
      <div class="f min0"><label>Tiempo verbal</label><div class="tchips">${tchips}</div></div>
      <div class="f"><label for="grp">Verbos</label><select id="grp"><option value="all" ${C.group==="all"?"selected":""}>Todos (${V.length})</option><option value="reg" ${C.group==="reg"?"selected":""}>Regulares</option><option value="irr" ${C.group==="irr"?"selected":""}>Irregulares</option></select></div>
      <div class="f"><label for="vsel">Elegir verbo</label><select id="vsel">${["Regulares","Irregulares"].map((g,gi)=>`<optgroup label="${g}">${V.filter(x=>!!x.irr===!!gi).map(x=>`<option value="${x.inf}" ${x===C.verb?"selected":""}>${x.inf} · ${x.es}</option>`).join("")}</optgroup>`).join("")}</select></div></div>`:""}

  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { C.mode=b.dataset.m; renderVerbs(); });
  bindSpk($("#view"));
  if (C.mode==="ref"){ $("#refsel").onchange = e => { C.refVerb=e.target.value; renderVerbs(); };
    document.querySelectorAll("[data-sayall]").forEach(b => b.onclick = () => { const v=V.find(x=>x.inf===C.refVerb), t=b.dataset.sayall, f=conj(v,t), pr=SUBJ(t)?PRON.map(p=>"che "+p):PRON; sayList(f.map((x,k)=>spokenPron(pr[k])+" "+spokenForm(x))); });
    return; }
  document.querySelectorAll(".tchip").forEach(b => b.onclick = () => { C.tense=b.dataset.t; C.checked=false; renderVerbs(); });

  fillEs(C.verb, C.tense);

  inputs[0].focus();
  inputs.forEach((inp,k) => inp.addEventListener("keydown", e => { if (e.key==="Enter"){ e.preventDefault(); if (C.checked) return $("#ccheck").click(); if (k<5 && !inputs[k+1].value) inputs[k+1].focus(); else $("#ccheck").click(); }}));
  $("#skip").onclick = () => { pickVerb(); renderVerbs(); };
  $("#again").onclick = () => { C.checked=false; renderVerbs(); };
  $("#show").onclick = () => { const f=conj(C.verb,C.tense); inputs.forEach((inp,k)=>{ inp.value=f[k].split("|")[0].replace(/([oi])\/([ae])$/,"$1"); inp.disabled=true; }); C.checked=true; $("#ccheck").textContent="Siguiente verbo →"; revealSpk(C.verb,C.tense); $("#again").hidden=false; };
  $("#ccheck").onclick = () => {
    if (C.checked){ pickVerb(); renderVerbs(); return; }
    const f = conj(C.verb, C.tense); let ok=0;
    inputs.forEach((inp,k) => {
      const v = norm(inp.value), acc = accepted(f[k]).map(norm);
      let res = acc.includes(v) ? "ok" : acc.map(deaccent).includes(deaccent(v)) && v ? "near" : "ko";
      inp.classList.remove("ok","ko","near"); inp.classList.add(res); inp.disabled = true;
      if (res!=="ok"){ const typed = inp.value.trim(); inp.hidden = true;

      if (res!=="ko") ok++;
    });
    const st = S.conj[C.tense] || {ok:0,tot:0}; st.ok += ok; st.tot += 6; S.conj[C.tense] = st;
    activity(ok);
    $("#cfb").innerHTML = ok===6 ? `<div class="fb ok"><b>${es("Perfetto!","¡Perfecto!")}</b> 6 de 6. +6 puntos.</div>` : `<div class="fb ko"><b>${ok} de 6.</b> Revisa las formas marcadas y vuelve a intentarlo con otro verbo.</div>`;
    C.checked = true; $("#ccheck").textContent = "Siguiente verbo →"; revealSpk(C.verb,C.tense); $("#again").hidden=false; $("#ccheck").focus();
  };
}

      <span class="eyebrow">Tarjeta ${R.i+1} de ${R.queue.length} · ${esc(c.lesson.title)}</span>
      <button class="flash" id="flash"><span class="box">Nivel ${st.box+1} / 6</span><span><div class="front">${esc(front)}</div>
        ${R.flipped?`<div class="back-es">${esc(back)}</div><div class="back-eg">${es(c.eg,c.egEs||TR[c.eg])}</div>`:`<div class="muted" style="margin-top:10px;font-size:13px">Toca para dar la vuelta</div>`}</span></button>
      ${R.flipped?`<div class="rate"><button class="btn no" id="no">${es("Da ripassare","Para repasar")}</button><button class="btn yes" id="yes">${es("Lo sapevo","Me la sabía")}</button></div>`:""}</div>`;
  }
  $("#view").innerHTML = head + body;
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { R.dir=b.dataset.d; R.flipped=false; renderReview(); });
  if ($("#again")) $("#again").onclick = () => { R=null; renderReview(); };
  if ($("#flash")) $("#flash").onclick = () => { R.flipped=!R.flipped; renderReview(); };
  if ($("#yes")){
    const c = R.queue[R.i];
    const rate = ok => { const s = S.cards[c.key] || {box:0}; s.box = ok?Math.min(s.box+1,5):0; s.due = addDays(today(), ok?INTERVALS[s.box]:1); S.cards[c.key]=s; if(ok) R.ok++; R.i++; R.flipped=false; save(); renderReview(); renderHeader(); };
    $("#yes").onclick = () => rate(true); $("#no").onclick = () => rate(false);
  }
}

/* ---------- stats ---------- */
function renderStats(){
  const cards = allCards();
  const learned = cards.filter(c => (S.cards[c.key]?.box||0) >= 3).length;
  const done = LESSONS.filter(L => S.lessons[L.id]?.best!=null).length;
  const ctot = Object.values(S.conj).reduce((a,b)=>({ok:a.ok+b.ok,tot:a.tot+b.tot}),{ok:0,tot:0});
  const cal = []; for (let k=27;k>=0;k--){ const d=addDays(today(),-k); cal.push(`<i class="${S.days.includes(d)?"on":""}${k===0?" today":""}" title="${d}"></i>`); }
  const conjRows = TENSES.map(t => { const s=S.conj[t.id]; const p = s&&s.tot ? Math.round(s.ok/s.tot*100) : null;
    return `<div class="bli"><span>${es(t.name,t.es)}</span><span class="tr"><span class="fl" style="width:${p??0}%"></span></span><span class="vl">${p==null?"sin datos":p+"%"}</span></div>`; }).join("");
  const lessonRows = LESSONS.map((L,i) => { const s=S.lessons[L.id]; const p = s?.best;
    return `<div class="bli"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${i+1}. ${L.title}</span><span class="tr"><span class="fl" style="width:${p??0}%"></span></span><span class="vl">${p==null?"-":p+"%"}</span></div>`; }).join("");
  $("#view").innerHTML = `
    <div><span class="eyebrow">${es("Progressi","Progreso")}</span><h1 style="font-size:clamp(32px,4.5vw,46px);margin:6px 0 0">${es("Il tuo percorso","Tu recorrido")}</h1></div>
    <div class="kpis">
      <div class="kpi hi"><span class="l">Racha</span><span class="v">${currentStreak()}</span><span class="d">días seguidos</span></div>
      <div class="kpi"><span class="l">Lecciones</span><span class="v">${done}/${LESSONS.length}</span><span class="d">completadas</span></div>
      <div class="kpi"><span class="l">Conjugaciones</span><span class="v">${ctot.tot?Math.round(ctot.ok/ctot.tot*100)+"%":"-"}</span><span class="d">${ctot.ok} formas correctas</span></div>
      <div class="kpi"><span class="l">Vocabulario</span><span class="v">${learned}/${cards.length}</span><span class="d">palabras consolidadas</span></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>Aciertos por tiempo verbal</h3><p class="cd">Del Coniugatore. Practica más los que estén por debajo del 80%.</p><div class="bl">${conjRows}</div></div>
      <div class="card"><h3>Mejor nota por lección</h3><p class="cd">Solo cuenta el intento completo de 10 ejercicios.</p><div class="bl">${lessonRows}</div></div>
    </div>
    <div class="card"><h3>Últimos 28 días</h3><p class="cd">Cada casilla marcada es un día con práctica.</p><div class="cal" style="max-width:460px">${cal.join("")}</div></div>
    <div class="confirm" id="reset-row"><button class="backbtn" id="reset">Borrar mi progreso</button></div>`;
  $("#reset").onclick = () => {
    $("#reset-row").innerHTML = `<span>¿Seguro? Se borran notas, racha, tarjetas y estadísticas de verbos.</span><button class="btn" id="yes-reset" style="background:var(--crit);color:#fff">Sí, borrar</button><button class="backbtn" id="no-reset">Cancelar</button>`;
    $("#yes-reset").onclick = () => { S = blank(); R=null; save(); route(); };
    $("#no-reset").onclick = () => renderStats();
  };
}


/* ---------- translator ---------- */
const TRX = {dir:"auto", text:"", busy:false, res:null, err:null, ctrl:null, copied:false};
let TRXH = []; try { TRXH = JSON.parse(localStorage.getItem("iiv-tr-hist")||"[]") || []; } catch(e){ TRXH = []; }
const saveTRH = () => { try { localStorage.setItem("iiv-tr-hist", JSON.stringify(TRXH.slice(0,12))); } catch(e){} };
const TR_DIRS = [["auto","Automático"],["es-it","Español → Italiano"],["it-es","Italiano → Español"]];
const speechOK = "speechSynthesis" in window;
function sayIt(text){
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "it-IT"; u.rate = .92;
    const v = speechSynthesis.getVoices().find(x => /^it/i.test(x.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e){}
}
function renderTrans(){
  $("#view").innerHTML = `
    <div><span class="eyebrow">${es("Traduttore","Traductor")}</span><h1 style="font-size:clamp(32px,4.5vw,46px);margin:6px 0 6px">${es("Come si dice?","¿Cómo se dice?")}</h1>
      <p class="muted" style="margin:0;max-width:62ch">Escribe una frase en español o en italiano y te la traduzco. Si hay algo que conviene saber (un falso amigo, una preposición, el registro), te lo explico en una nota breve.</p></div>
    <div class="card stack">
      <div class="seg" role="group" aria-label="Dirección de la traducción">${TR_DIRS.map(([k,l]) => `<button type="button" data-dir="${k}" aria-pressed="${k===TRX.dir}">${l}</button>`).join("")}</div>
      <textarea class="inp ta" id="trin" rows="3" maxlength="1000" placeholder="Por ejemplo: ¿A qué hora sale el próximo tren para Florencia?" autocapitalize="sentences">${esc(TRX.text)}</textarea>
      <div class="trrow">${accentBar("trin")}<span class="muted small" id="trcount"></span></div>
      <div class="actions"><span class="muted small" id="trkbd">Ctrl + Enter para traducir</span><button class="btn ghost" id="trclear">Borrar</button><button class="btn mag" id="trgo">Traducir</button></div>
      <div id="trout" aria-live="polite"></div>
    </div>
    <div class="card" id="trhist"></div>`;
  const inp = $("#trin");
  const upd = () => { TRX.text = inp.value; $("#trcount").textContent = inp.value.length ? inp.value.length+"/1000" : ""; $("#trgo").disabled = TRX.busy || !inp.value.trim(); };
  inp.addEventListener("input", upd); upd();
  inp.addEventListener("keydown", e => { if (e.key==="Enter" && (e.ctrlKey||e.metaKey)){ e.preventDefault(); doTranslate(); } });
  if (!canHover) $("#trkbd").hidden = true;
  document.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => { TRX.dir = b.dataset.dir; document.querySelectorAll("[data-dir]").forEach(x => x.setAttribute("aria-pressed", x.dataset.dir===TRX.dir)); });
  $("#trgo").onclick = doTranslate;
  $("#trclear").onclick = () => { if (TRX.ctrl) TRX.ctrl.abort(); TRX.text=""; TRX.res=null; TRX.err=null; TRX.busy=false; inp.value=""; upd(); renderTrOut(); inp.focus(); };
  renderTrOut(); renderTrHist();
  if (canHover && !TRX.res) inp.focus();
}
function renderTrOut(){
  const o = $("#trout"); if (!o) return;
  const g = $("#trgo"); if (g) g.disabled = TRX.busy || !TRX.text.trim();
  if (TRX.busy){ o.innerHTML = `<div class="trres"><small>Traduciendo…</small><div class="skel"></div><div class="skel"></div></div>`; return; }
  if (TRX.err){ o.innerHTML = `<div class="fb ko"><b>No se pudo traducir.</b> ${esc(TRX.err)}</div>`; return; }
  if (!TRX.res){ o.innerHTML = ""; return; }
  const r = TRX.res, toIt = r.to === "it";
  o.innerHTML = `<div class="trres">
    <div class="trhead"><small>${toIt ? "Italiano" : "Español"}</small>
      <div class="tracts">${toIt && speechOK ? `<button class="backbtn" id="trsay">Escuchar</button>` : ""}<button class="backbtn" id="trcopy">${TRX.copied ? "Copiado" : "Copiar"}</button><button class="backbtn" id="trswap" title="Traducir de vuelta">Invertir</button></div></div>
    <p class="trtext" lang="${toIt ? "it" : "es"}">${esc(r.translation)}</p>
    ${r.alt && r.alt.length ? `<div class="tralt"><small>${toIt ? "También se dice" : "También"}</small>${r.alt.map(a => `<span lang="${toIt ? "it" : "es"}">${esc(a)}</span>`).join("")}</div>` : ""}
    ${r.note ? `<div class="trap"><b>Nota.</b> ${esc(r.note)}</div>` : ""}
  </div>`;
  if ($("#trsay")) $("#trsay").onclick = () => sayIt(r.translation);
  $("#trcopy").onclick = async () => { try { await navigator.clipboard.writeText(r.translation); TRX.copied = true; renderTrOut(); setTimeout(() => { TRX.copied = false; renderTrOut(); }, 1500); } catch(e){} };
  $("#trswap").onclick = () => { TRX.text = r.translation; TRX.dir = toIt ? "it-es" : "es-it"; TRX.res = null; renderTrans(); doTranslate(); };
}
function renderTrHist(){
  const h = $("#trhist"); if (!h) return;
  if (!TRXH.length){ h.innerHTML = `<h3>Últimas traducciones</h3><p class="cd" style="margin-bottom:0">Aquí verás tus frases traducidas. Se guardan solo en este navegador.</p>`; return; }
  h.innerHTML = `<div class="trhist-h"><h3>Últimas traducciones</h3><button class="backbtn" id="trhclear">Vaciar</button></div>
    <div>${TRXH.map((x,i) => `<button class="thi" data-i="${i}"><span class="s">${esc(x.src)}</span><span class="o" lang="${x.to}">${esc(x.out)}</span></button>`).join("")}</div>`;
  h.querySelectorAll(".thi").forEach(b => b.onclick = () => { const x = TRXH[+b.dataset.i]; TRX.text = x.src; TRX.res = {to:x.to, translation:x.out, alt:x.alt||[], note:x.note||""}; TRX.err = null; renderTrans(); window.scrollTo({top:0, behavior:"smooth"}); });
  $("#trhclear").onclick = () => { TRXH = []; saveTRH(); renderTrHist(); };
}
async function doTranslate(){
  const inp = $("#trin"); const text = (inp ? inp.value : TRX.text).trim();
  if (!text || TRX.busy) return;
  TRX.text = text; TRX.busy = true; TRX.err = null; TRX.res = null; renderTrOut();
  try {
    if (sampleFn === undefined) sampleFn = (window.claude && claude.use) ? await claude.use("sample") : null;
    if (!sampleFn) throw {code:"not_available"};
    const dirTxt = TRX.dir==="es-it" ? "El texto está en español: tradúcelo al italiano."
      : TRX.dir==="it-es" ? "El texto está en italiano: tradúcelo al español de España."
      : "Detecta si el texto está en español o en italiano y tradúcelo a la otra lengua. Si está en otra lengua distinta, tradúcelo al italiano.";
    const prompt = `Eres el traductor de una app para una hispanohablante de España que aprende italiano (nivel A2-B1). ${dirTxt}
Traduce de forma natural, como lo diría un nativo, manteniendo el sentido, el tono y el registro (tú → tu, usted → Lei). Español de España; italiano estándar. No uses el signo de raya (—).
Responde SOLO con un objeto JSON con esta forma:
{"to":"it" o "es","translation":"la traducción","alt":["0 a 2 alternativas igual de naturales, solo si existen"],"note":"una nota breve en español (máximo 30 palabras) si hay algo útil para quien aprende: falso amigo, preposición, artículo, registro, subjuntivo, expresión idiomática. Cadena vacía si no hace falta."}

Texto:
${text}`;
    if (TRX.ctrl) TRX.ctrl.abort();
    TRX.ctrl = new AbortController();
    const r = await sampleFn.json(prompt, {modelTier:"quick", cache:true, signal:TRX.ctrl.signal});
    if (!r || typeof r.translation !== "string" || !r.translation.trim()) throw {code:"bad"};
    TRX.res = {to: r.to==="es" ? "es" : "it", translation:r.translation.trim(), alt:Array.isArray(r.alt) ? r.alt.filter(a => typeof a==="string" && a.trim() && a.trim()!==r.translation.trim()).slice(0,2) : [], note: typeof r.note==="string" ? r.note.trim() : ""};
    TRXH = [{src:text, out:TRX.res.translation, to:TRX.res.to, alt:TRX.res.alt, note:TRX.res.note}, ...TRXH.filter(x => x.src !== text)].slice(0,12); saveTRH();
  } catch(err){
    if (err && err.code === "cancelled") return;
    TRX.err = err && err.code==="not_available" ? "El traductor solo funciona con la página abierta en Claude."
      : err && err.code==="not_granted" ? "Hace falta permitir que la página consulte a Claude (menú Permisos del artefacto)."
      : err && err.code==="rate_limited" ? "Demasiadas peticiones seguidas, prueba en un momento."
      : "Inténtalo de nuevo en un momento.";
  } finally {
    TRX.busy = false;
  }
  if (tab === "trans"){ renderTrOut(); renderTrHist(); }
}


/* ---------- translations: hover, right-click, long-press, toggle ---------- */
const tipEl = document.getElementById("tip");
let tipTimer = null, sampleFn, longPressed = false;
function showTip(html, x, y){
  tipEl.innerHTML = html; tipEl.hidden = false;
  const r = tipEl.getBoundingClientRect(), W = innerWidth, H = innerHeight;
  let left = Math.min(Math.max(16, x - r.width/2), W - r.width - 16), top = y - r.height - 12;
  if (top < 8) top = y + 18;
  tipEl.style.left = left+"px"; tipEl.style.top = Math.min(top, H - r.height - 8)+"px";
}
function hideTip(){ clearTimeout(tipTimer); tipEl.hidden = true; }
function tipFor(el){ const r = el.getBoundingClientRect(); showTip(`<small>Español</small>${esc(el.dataset.es)}`, r.left + Math.min(r.width,320)/2, r.top); }
const canHover = matchMedia("(hover:hover) and (pointer:fine)").matches;
if (canHover){
  document.addEventListener("mouseover", e => {
    const el = e.target.closest && e.target.closest("[data-es]");
    clearTimeout(tipTimer);
    if (!el){ tipEl.hidden = true; return; }
    if (document.body.classList.contains("show-es")) return;
    tipTimer = setTimeout(() => tipFor(el), 450);
  });
}
async function translateSelection(text, x, y){
  showTip(`<small>Traduciendo…</small>${esc(text.length>80?text.slice(0,80)+"…":text)}`, x, y);
  try {
    if (sampleFn === undefined) sampleFn = (window.claude && claude.use) ? await claude.use("sample") : null;
    if (!sampleFn){ showTip(`<small>No disponible</small>La traducción libre solo funciona con la página abierta en Claude. Las frases subrayadas sí tienen traducción.`, x, y); return; }
    const res = await sampleFn("Traduce al español de España este texto en italiano. Responde solo con la traducción, sin comillas ni explicaciones.\n\n" + text, {modelTier:"quick", cache:true});
    showTip(`<small>Español</small>${esc((res.text||"").trim())}`, x, y);
  } catch(err){
    showTip(`<small>No se pudo traducir</small>${err && err.code==="rate_limited" ? "Demasiadas peticiones, prueba en un momento." : "Inténtalo de nuevo más tarde."}`, x, y);
  }
}
document.addEventListener("contextmenu", e => {
  if (e.target.closest && e.target.closest("input,select,textarea")) return;
  const sel = String(getSelection() || "").trim();
  const el = e.target.closest && e.target.closest("[data-es]");
  if (sel && sel.length < 400 && !(el && el.textContent.trim() === sel)){ e.preventDefault(); translateSelection(sel, e.clientX, e.clientY); return; }
  if (el){ e.preventDefault(); tipFor(el); }
});
/* long press for iPhone/iPad, where contextmenu does not fire */
let lpTimer = null;
document.addEventListener("touchstart", e => {
  const el = e.target.closest && e.target.closest("[data-es]"); longPressed = false;
  if (!el) { hideTip(); return; }
  lpTimer = setTimeout(() => { longPressed = true; tipFor(el); }, 500);
}, {passive:true});
document.addEventListener("touchmove", () => clearTimeout(lpTimer), {passive:true});
document.addEventListener("touchend", () => clearTimeout(lpTimer), {passive:true});
document.addEventListener("click", e => { if (longPressed){ e.preventDefault(); e.stopPropagation(); longPressed = false; } }, true);
document.addEventListener("scroll", hideTip, {passive:true});
document.addEventListener("keydown", e => { if (e.key==="Escape") hideTip(); });
const esBtn = document.getElementById("estoggle");
function setEs(on){ document.body.classList.toggle("show-es", on); esBtn.setAttribute("aria-pressed", on); esBtn.querySelector("span").textContent = on ? "Ocultar traducción" : "Ver traducción"; hideTip(); try{ localStorage.setItem("iiv-show-es", on?"1":"0"); }catch(e){} }
esBtn.onclick = () => setEs(!document.body.classList.contains("show-es"));
try { if (localStorage.getItem("iiv-show-es")==="1") setEs(true); } catch(e){}

route();
</script>
